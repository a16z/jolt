[package]
name = "jolt-eval"
version = "0.1.0"
edition = "2021"

[dependencies]
jolt-prover-legacy = { workspace = true, features = ["host"] }
jolt-verifier = { workspace = true }
jolt-dory = { workspace = true }
jolt-crypto = { workspace = true }
jolt-program = { workspace = true, features = ["serialization"] }
jolt-tracer-x86 = { workspace = true }
jolt-riscv = { workspace = true, features = ["serialization"] }
jolt-field = { workspace = true }
jolt-transcript = { workspace = true, features = [
  "transcript-blake2b",
  "transcript-keccak",
  "transcript-poseidon",
] }
spongefish = { workspace = true }
common = { workspace = true, features = ["std"] }
tracer = { workspace = true }

ark-bn254 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
postcard = { workspace = true, features = ["use-std"] }
eyre = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true, features = ["derive"] }
rand = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }

arbitrary = { version = "1", features = ["derive"] }
enumset = "1"
schemars = "1.2"
tempfile = "3"

rust-code-analysis = "0.0.25"

jolt-inlines-keccak256 = { workspace = true, features = ["host"] }
jolt-inlines-secp256k1 = { workspace = true, features = ["host"] }
jolt-inlines-sha2 = { workspace = true, features = ["host"] }

jolt-eval-macros = { path = "macros" }

# Peak RSS via getrusage; linux reads /proc/self/status instead.
[target.'cfg(all(unix, not(target_os = "linux")))'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { workspace = true }
iai-callgrind.workspace = true
iai-callgrind-runner.workspace = true
jolt-poly.workspace = true

[[bench]]
name = "bind_parallel_high_to_low"
harness = false

[[bench]]
name = "bind_parallel_low_to_high"
harness = false

[[bench]]
name = "field_mul_i128"
harness = false

[[bench]]
name = "field_mul_i64"
harness = false

[[bench]]
name = "field_mul_u128"
harness = false

[[bench]]
name = "field_mul_u64"
harness = false

[[bench]]
name = "naive_sort_time"
harness = false

[[bench]]
name = "prover_time_fibonacci"
harness = false

[[bench]]
name = "prover_time_secp256k1_ecdsa_verify"
harness = false

[[bench]]
name = "prover_time_sha2_chain"
harness = false

[[bench]]
name = "eq_evals"
path = "benches/callgrind/eq_evals.rs"
harness = false

[[bench]]
name = "trace_gen_fibonacci"
harness = false

[[bench]]
name = "trace_gen_sha2_chain"
harness = false

[[bin]]
name = "measure-objectives"
path = "bin/measure_objectives.rs"

[[bin]]
name = "optimize"
path = "bin/optimize.rs"

[[bin]]
name = "redteam"
path = "bin/redteam.rs"

[[bin]]
name = "trace-gen-baseline"
path = "bin/trace_gen_baseline.rs"

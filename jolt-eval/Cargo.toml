[package]
name = "jolt-eval"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Metal isolated objectives (macOS): device kernels plus the modular-prover
# plumbing the st0-contention objective drives (commit slot + record walk).
metal = [
  "dep:jolt-kernels",
  "jolt-kernels/metal",
  "dep:jolt-prover",
  "jolt-prover/metal",
  "dep:jolt-witness",
  "dep:jolt-claims",
  "dep:libc",
]

[dependencies]
jolt-prover-legacy = { workspace = true, features = ["host"] }
jolt-verifier = { workspace = true }
jolt-dory = { workspace = true }
jolt-crypto = { workspace = true }
jolt-program = { workspace = true, features = ["serialization"] }
jolt-riscv = { workspace = true, features = ["serialization"] }
jolt-field = { workspace = true }
jolt-poly = { workspace = true }
jolt-kernels = { workspace = true, features = ["bench-utils"] }
jolt-transcript = { workspace = true, features = [
  "transcript-blake2b",
  "transcript-keccak",
  "transcript-poseidon",
] }
spongefish = { workspace = true }
common = { workspace = true, features = ["std"] }
tracer = { workspace = true }

ark-bn254 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
postcard = { workspace = true, features = ["use-std"] }
eyre = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true, features = ["derive"] }
rand = { workspace = true }
rayon = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }

arbitrary = { version = "1", features = ["derive"] }
enumset = "1"
schemars = "1.2"
tempfile = "3"

rust-code-analysis = "0.0.25"

jolt-inlines-secp256k1 = { workspace = true, features = ["host"] }
jolt-inlines-sha2 = { workspace = true, features = ["host"] }

jolt-eval-macros = { path = "macros" }

[target.'cfg(target_os = "macos")'.dependencies]
jolt-kernels = { workspace = true, optional = true }
jolt-prover = { workspace = true, optional = true }
jolt-witness = { workspace = true, optional = true }
jolt-claims = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
iai-callgrind.workspace = true


<text x="770" y="552" font-size="18" fill="#183044" font-weight="bold" text-anchor="start">Both require both cycle chunks</text>
<path d="M36,591 L1164,591" stroke="#d8e1e8" stroke-width="2" fill="none"/>
<text x="36" y="627" font-size="20" fill="#183044" font-weight="bold" text-anchor="start">First-fold t̂ᵢ: 43 digits × 256 coefficients = 11,008 coefficients each</text>
<text x="36" y="654" font-size="17" fill="#536879" font-weight="normal" text-anchor="start">Below: the beginning of the old t_hat segment, in its actual serialized order.</text>
<rect x="46" y="674" width="116" height="53" fill="#dceeff" stroke="#fff" rx="0"/>

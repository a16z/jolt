<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
<title id="title">Old polynomial packing mixes cycle chunks at the second fold</title>
<desc id="desc">A real K16 W2R2 schedule with 65536 cycles. First-fold blocks alternate owners by cycle half. Second-fold block 24 spans e hat zero through part of e hat 23; block 27 spans part of t hat 1 through part of t hat 7. Both new partial evaluations and inner commitments depend on both cycle owners.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#183044"/></marker></defs>
<rect width="1200" height="980" rx="14" fill="#fff"/>
<g font-family="Helvetica,Arial,sans-serif" fill="#183044">
<text x="36" y="42" font-size="25" fill="#183044" font-weight="bold" text-anchor="start">Old packing: first-fold e and t mix cycle owners at the second fold</text>
<text x="36" y="73" font-size="18" fill="#536879" font-weight="normal" text-anchor="start">Actual pre-PR K=16 / W2R2 row: T=65,536; 64 selector slots; physical arity 26.</text>
<rect x="36" y="96" width="21" height="21" fill="#dceeff" stroke="#12639c" rx="3"/>
<text x="67" y="112" font-size="17" fill="#12639c" font-weight="normal" text-anchor="start">Cycle chunk 0: cycles 0–32,767 of every polynomial</text>
<rect x="650" y="96" width="21" height="21" fill="#ffe7cc" stroke="#ad5b0b" rx="3"/>
<text x="681" y="112" font-size="17" fill="#ad5b0b" font-weight="normal" text-anchor="start">Cycle chunk 1: cycles 32,768–65,535</text>
<text x="36" y="152" font-size="20" fill="#183044" font-weight="bold" text-anchor="start">First fold: the old (slot | cycle | address) order alternates cycle owners</text>
<text x="148" y="177" font-size="16" fill="#536879" font-weight="normal" text-anchor="middle">Polynomial 0</text>
<rect x="36" y="188" width="112" height="43" fill="#dceeff" stroke="#fff" rx="3"/>
<text x="92" y="216" font-size="20" fill="#183044" font-weight="normal" text-anchor="middle">s0</text>
<rect x="148" y="188" width="112" height="43" fill="#ffe7cc" stroke="#fff" rx="3"/>
<text x="204" y="216" font-size="20" fill="#183044" font-weight="normal" text-anchor="middle">s1</text>
<text x="398" y="177" font-size="16" fill="#536879" font-weight="normal" text-anchor="middle">Polynomial 1</text>
<rect x="286" y="188" width="112" height="43" fill="#dceeff" stroke="#fff" rx="3"/>
<text x="342" y="216" font-size="20" fill="#183044" font-weight="normal" text-anchor="middle">s2</text>
<rect x="398" y="188" width="112" height="43" fill="#ffe7cc" stroke="#fff" rx="3"/>
<text x="454" y="216" font-size="20" fill="#183044" font-weight="normal" text-anchor="middle">s3</text>
<text x="648" y="177" font-size="16" fill="#536879" font-weight="normal" text-anchor="middle">Polynomial 2</text>
<rect x="536" y="188" width="112" height="43" fill="#dceeff" stroke="#fff" rx="3"/>
<text x="592" y="216" font-size="20" fill="#183044" font-weight="normal" text-anchor="middle">s4</text>
<rect x="648" y="188" width="112" height="43" fill="#ffe7cc" stroke="#fff" rx="3"/>
<text x="704" y="216" font-size="20" fill="#183044" font-weight="normal" text-anchor="middle">s5</text>
<text x="898" y="177" font-size="16" fill="#536879" font-weight="normal" text-anchor="middle">Polynomial 3</text>
<rect x="786" y="188" width="112" height="43" fill="#dceeff" stroke="#fff" rx="3"/>
<text x="842" y="216" font-size="20" fill="#183044" font-weight="normal" text-anchor="middle">s6</text>
<rect x="898" y="188" width="112" height="43" fill="#ffe7cc" stroke="#fff" rx="3"/>
<text x="954" y="216" font-size="20" fill="#183044" font-weight="normal" text-anchor="middle">s7</text>
<text x="1050" y="217" font-size="17" fill="#536879" font-weight="normal" text-anchor="start">… s126 | s127</text>
<text x="36" y="263" font-size="18" fill="#183044" font-weight="normal" text-anchor="start">First-fold êᵢ and t̂ᵢ inherit the same even/odd ownership. Their digits feed the next fold.</text>
<path d="M36,282 L1164,282" stroke="#d8e1e8" stroke-width="2" fill="none"/>
<text x="36" y="318" font-size="20" fill="#183044" font-weight="bold" text-anchor="start">First-fold êᵢ: 43 digits × 64 coefficients = 2,752 coefficients each</text>
<text x="36" y="345" font-size="17" fill="#536879" font-weight="normal" text-anchor="start">Below: the beginning of the old e_hat segment, in its actual serialized order.</text>

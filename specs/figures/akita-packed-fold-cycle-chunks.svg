<text x="770" y="861" font-size="18" fill="#183044" font-weight="bold" text-anchor="start">Both require both cycle chunks</text>
<text x="36" y="925" font-size="18" fill="#183044" font-weight="bold" text-anchor="start">Each outlined second-fold block is 1,024 × 64 = 65,536 consecutive coefficients.</text>
<text x="36" y="953" font-size="17" fill="#536879" font-weight="normal" text-anchor="start">These blocks lie inside e_hat or t_hat. Neither crosses a z_hat boundary.</text>
</g></svg>

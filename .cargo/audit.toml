# Read by `cargo audit` from the repository root, including the nightly run in
# .github/workflows/cargo-audit.yml. Each ignore states why the affected code is
# unreachable and when to remove the entry.
[advisories]
ignore = [
  # crypto-bigint < 0.7.6 branches on secret values in arithmetic meant to be
  # constant-time. 0.5.5 comes from the RustCrypto 0.13 curve stack
  # (elliptic-curve 0.13 requires crypto-bigint 0.5): k256 0.13 via alloy in
  # examples/sig-recovery and examples/ethereum-transaction, and k256 0.13 and
  # p256 0.13 via revm-precompile in examples/ethereum-transaction. None of them
  # handles a secret: they recover or verify signers from public signatures
  # (sig-recovery's host signs with the `secp256k1` crate). Remove once alloy and
  # revm-precompile release on k256 0.14 and p256 0.14.
  "RUSTSEC-2026-0387",
]

[package]
name = "common"
version = "0.2.0"
edition = "2021"

[lints]
workspace = true

[features]
default = ["std"]
allocative = ["dep:allocative"]
# Selects the field-inline (FR) protocol composition's BlindFold generator
# budget (see `constants::MAX_BLINDFOLD_GENERATORS`). Forwarded by the
# crates that read the constant (jolt-verifier, jolt-prover-legacy).
field-inline = []
std = [
  "allocative",
  "dep:ark-serialize",
  "ark-serialize?/std",
  "serde/std",
  "syn/full",
]

[dependencies]
allocative = { workspace = true, optional = true }
ark-serialize = { workspace = true, default-features = false, optional = true }
serde = { workspace = true, default-features = false, features = ["alloc"] }
syn = { workspace = true, optional = true }

[dev-dependencies]
bincode = { workspace = true }

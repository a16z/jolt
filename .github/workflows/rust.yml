name: Build and Test Jolt

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**", main]
    paths-ignore:
      - "specs/**"
      - "*.md"
      - ".claude/**"

env:
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

# Caching strategy: jobs with near-identical dependency footprints share one
# rust-cache entry (shared-key), and only the job with the largest footprint
# saves it. Per-job caches previously totaled >10 GB, blowing the repository
# cache quota so every run started cold.
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          components: rustfmt
          cache: false
      - name: cargo fmt
        run: cargo fmt --all --check

  taplo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install taplo
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: taplo-cli
      - name: taplo fmt --check
        run: taplo fmt --check

  style:
    runs-on: ubuntu-latest
    steps:
      # Full history (blobs lazily fetched) so the diff-scoped rules can
      # resolve an exact merge base; see scripts/check_style_invariants.py.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: check style invariants
        run: python3 scripts/check_style_invariants.py --base "origin/${{ github.base_ref || 'main' }}"

  field-stack:
    name: Shared field feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      - name: Install nextest
        uses: taiki-e/install-action@45fceba0fc176f41d2aee1ca9d6598ba628eea62 # nextest
      - name: Require one jolt-field identity (no akita-field post-cutover)
        run: scripts/check-shared-field-identity.sh
      - name: Check no backend
        run: cargo check -p jolt-field --no-default-features
      - name: Check BN254 backend
        run: cargo check -p jolt-field --no-default-features --features bn254
      - name: Test Solinas backend
        run: cargo nextest run -p jolt-field --no-default-features --features solinas --cargo-quiet
      - name: Test parallel Solinas backend
        run: cargo nextest run -p jolt-field --no-default-features --features solinas,parallel --cargo-quiet
      - name: Check combined backends
        run: cargo check -p jolt-field --no-default-features --features bn254,solinas

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          components: clippy
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: clippy
      - name: cargo clippy --features allocative,host
        run: cargo clippy --all --all-targets --features allocative,host
      - name: cargo clippy --features allocative,host,zk
        run: cargo clippy --all --all-targets --features allocative,host,zk
      - name: cargo clippy --no-default-features
        run: cargo clippy --all --all-targets --no-default-features
      # jolt-verifier's prover-fixtures feature gates live prover artifact
      # generation for verifier tests. It is not enabled by the workspace-wide
      # invocations above, so build it explicitly in both modes.
      - name: cargo clippy -p jolt-verifier --features prover-fixtures
        run: cargo clippy -p jolt-verifier --all-targets --features prover-fixtures
      - name: cargo clippy -p jolt-verifier --features prover-fixtures,zk
        run: cargo clippy -p jolt-verifier --all-targets --features prover-fixtures,zk
      # The akita feature selects the lattice (Akita) PIOP; it is not enabled
      # by the workspace-wide invocations above.
      - name: cargo clippy -p jolt-verifier --features akita
        run: cargo clippy -p jolt-verifier --all-targets --features akita
      # The akita fixture-driven tamper suite compiles under akita,prover-fixtures
      # (the real packed prover generates its fixtures). Lint it explicitly.
      - name: cargo clippy -p jolt-verifier --features akita,prover-fixtures
        run: cargo clippy -p jolt-verifier --all-targets --features akita,prover-fixtures
      # The modular prover's packed (Akita) path: lint alone and with
      # prover-fixtures so the acceptance suites keep compiling.
      - name: cargo clippy -p jolt-prover --features akita
        run: cargo clippy -p jolt-prover --all-targets --features akita
      - name: cargo clippy -p jolt-prover --features akita,prover-fixtures
        run: cargo clippy -p jolt-prover --all-targets --features akita,prover-fixtures
      # The Dory arms of the guest x mode matrix and the e2e suites compile
      # only under prover-fixtures; lint both protocols like the akita pair.
      - name: cargo clippy -p jolt-prover --features prover-fixtures
        run: cargo clippy -p jolt-prover --all-targets --features prover-fixtures
      - name: cargo clippy -p jolt-prover --features prover-fixtures,zk
        run: cargo clippy -p jolt-prover --all-targets --features prover-fixtures,zk
      # The profiling feature gates the profile harness bin and smoke test.
      # The smoke test cannot RUN in CI yet (reference-backend memory — see
      # the NOTE above the prover test jobs), but everything behind the
      # feature must keep compiling. Lint it in both flamegraph modes.
      - name: cargo clippy -p jolt-prover --features profiling
        run: cargo clippy -p jolt-prover --all-targets --features profiling
      - name: cargo clippy -p jolt-prover --features profiling,allocative
        run: cargo clippy -p jolt-prover --all-targets --features profiling,allocative
      # The packed profile harness: the same bin/smoke test driving
      # akita::prove. Lint both flamegraph modes, like the Dory pair above.
      - name: cargo clippy -p jolt-prover --features akita,profiling
        run: cargo clippy -p jolt-prover --all-targets --features akita,profiling
      - name: cargo clippy -p jolt-prover --features akita,profiling,allocative
        run: cargo clippy -p jolt-prover --all-targets --features akita,profiling,allocative
      # The field-inline feature is not enabled by host/zk/default, so the
      # workspace-wide invocations above never build it. Lint the crates that
      # define it explicitly so the feature keeps compiling.
      - name: Check field-inline claim crate without workspace feature unification
        run: cargo clippy -p jolt-claims --all-targets --features field-inline
      - name: cargo clippy --features field-inline
        run: >
          cargo clippy
          -q
          --message-format=short
          -p jolt-claims
          -p jolt-verifier
          -p jolt-witness
          -p jolt-r1cs
          -p tracer
          -p jolt-program
          -p jolt-riscv
          -p jolt-lookup-tables
          -p jolt-kernels
          -p jolt-akita
          --all-targets
          --features field-inline
          --
          -D warnings
      # The profile harness under field-inline: the field-inline guest path and
      # the `field-ops` workload, in both flamegraph modes and both
      # protocols.
      - name: cargo clippy -p jolt-prover --features profiling,field-inline
        run: cargo clippy -p jolt-prover --all-targets --features profiling,field-inline
      - name: cargo clippy -p jolt-prover --features profiling,allocative,field-inline
        run: cargo clippy -p jolt-prover --all-targets --features profiling,allocative,field-inline
      - name: cargo clippy -p jolt-prover --features akita,profiling,field-inline
        run: cargo clippy -p jolt-prover --all-targets --features akita,profiling,field-inline
      # The field-inline matrix and specialized e2e suites, plus the
      # jolt-verifier tamper suite over modular-prover fixtures.
      - name: cargo clippy -p jolt-prover --features prover-fixtures,field-inline
        run: cargo clippy -p jolt-prover --all-targets --features prover-fixtures,field-inline
      - name: cargo clippy -p jolt-prover --features prover-fixtures,field-inline,zk
        run: cargo clippy -p jolt-prover --all-targets --features prover-fixtures,field-inline,zk
      - name: cargo clippy -p jolt-verifier --features prover-fixtures,field-inline
        run: cargo clippy -p jolt-verifier --all-targets --features prover-fixtures,field-inline
      # The packed field-inline combination: the field-inline limb group rides the
      # dense-group heterogeneous batch beside advice.
      - name: cargo clippy -p jolt-verifier --features field-inline,akita
        run: cargo clippy -p jolt-verifier --all-targets --features field-inline,akita
      - name: cargo clippy -p jolt-verifier --features prover-fixtures,field-inline,akita
        run: cargo clippy -p jolt-verifier --all-targets --features prover-fixtures,field-inline,akita
      - name: cargo clippy -p jolt-prover --features prover-fixtures,field-inline,akita
        run: cargo clippy -p jolt-prover --all-targets --features prover-fixtures,field-inline,akita
      - name: cargo clippy -p jolt-sdk --features host,field-inline
        run: >
          cargo clippy
          -q
          --message-format=short
          -p jolt-sdk
          --all-targets
          --features host,field-inline
          --
          -D warnings
      # Recursion's non-default host paths are not selected by workspace checks.
      - name: cargo clippy -p recursion --features field-inline
        run: cargo clippy -p recursion --all-targets --features field-inline -- -D warnings
      - name: cargo clippy -p recursion --features akita,field-inline,ntt-inline
        run: cargo clippy -p recursion --all-targets --features akita,field-inline,ntt-inline -- -D warnings

  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bnjbvr/cargo-machete@135555c9cd9f3b4723dee2766f0cacb99aac092b # main
      - name: cargo machete
        run: cargo machete --with-metadata

  build-wasm:
    name: Build Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: wasm
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      # jolt-platform owns the wasm RNG backend (getrandom 0.2 `js`, 0.3
      # `wasm_js`); the SDK and `jolt build-wasm` reach it through
      # `jolt-platform/random`. Build it alongside the prover so feature
      # unification supplies the backend here too, instead of anchoring it in
      # a library crate.
      - name: Build Wasm
        run: RUSTFLAGS='--cfg getrandom_backend="wasm_js"' cargo build -p jolt-prover -p jolt-platform --features jolt-platform/random --release --target wasm32-unknown-unknown

  test-prover:
    runs-on: ubuntu-latest
    name: Test jolt-prover
    # The Dory clear arm of the guest x mode acceptance matrix
    # (crates/jolt-prover/tests/e2e_matrix.rs) proves real guests here, so
    # this lane installs the guest toolchain and the jolt CLI like the zk and
    # akita lanes, which run the same matrix under their protocol.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          components: rust-src
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-tests
          save-if: false
          cache-directories: ~/.cache/dory
      - name: Cache ZeroOS musl toolchain
        id: cache-zeroos-musl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.zeroos/musl
          key: zeroos-musl-toolchain-musl-1.2.3-gcc-9.4.0-Linux-x86_64
      - name: Install ZeroOS musl toolchain
        if: steps.cache-zeroos-musl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/LayerZero-Labs/ZeroOS/releases/download/musl-toolchain-musl-1.2.3-gcc-9.4.0/zeroos-musl-toolchain-musl-1.2.3-gcc-9.4.0-Linux-x86_64.tar.gz -o /tmp/zeroos-musl.tar.gz
          mkdir -p ~/.zeroos
          tar -xzf /tmp/zeroos-musl.tar.gz -C ~/.zeroos
      - name: Build and install jolt CLI
        run: cargo install --path . --locked --force --profile ci --target-dir target
      - name: Install nextest
        uses: taiki-e/install-action@45fceba0fc176f41d2aee1ca9d6598ba628eea62 # nextest
      - name: Run jolt-prover tests
        run: cargo nextest run --cargo-profile ci -p jolt-prover --features prover-fixtures

  trace-equivalence:
    runs-on: ubuntu-latest
    name: Tracer serial/parallel equivalence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          components: rust-src
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-tests
          save-if: false
          cache-directories: ~/.cache/dory
      - name: Cache ZeroOS musl toolchain
        id: cache-zeroos-musl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.zeroos/musl
          key: zeroos-musl-toolchain-musl-1.2.3-gcc-9.4.0-Linux-x86_64
      - name: Install ZeroOS musl toolchain
        if: steps.cache-zeroos-musl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/LayerZero-Labs/ZeroOS/releases/download/musl-toolchain-musl-1.2.3-gcc-9.4.0/zeroos-musl-toolchain-musl-1.2.3-gcc-9.4.0-Linux-x86_64.tar.gz -o /tmp/zeroos-musl.tar.gz
          mkdir -p ~/.zeroos
          tar -xzf /tmp/zeroos-musl.tar.gz -C ~/.zeroos
      - name: Build and install jolt CLI
        run: cargo install --path . --locked --force --profile ci --target-dir target
      # Every parallel configuration must produce byte-identical output to the
      # serial interpreter. The harness runs each configuration in a child
      # process and compares within the run, so there are no committed hashes
      # to re-record.
      - name: Serial/parallel trace equivalence
        run: cargo run --profile ci -p tracer --example trace_equivalence

  x86-tracer:
    runs-on: ubuntu-latest
    name: x86 AOT tracer backend (native x86-64)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          components: rust-src
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-tests
          save-if: false
      - name: Install nextest
        uses: taiki-e/install-action@45fceba0fc176f41d2aee1ca9d6598ba628eea62 # nextest
      # Guest ELFs link ZeroOS, so building them needs its musl toolchain.
      - name: Cache ZeroOS musl toolchain
        id: cache-zeroos-musl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.zeroos/musl
          key: zeroos-musl-toolchain-musl-1.2.3-gcc-9.4.0-Linux-x86_64
      - name: Install ZeroOS musl toolchain
        if: steps.cache-zeroos-musl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/LayerZero-Labs/ZeroOS/releases/download/musl-toolchain-musl-1.2.3-gcc-9.4.0/zeroos-musl-toolchain-musl-1.2.3-gcc-9.4.0-Linux-x86_64.tar.gz -o /tmp/zeroos-musl.tar.gz
          mkdir -p ~/.zeroos
          tar -xzf /tmp/zeroos-musl.tar.gz -C ~/.zeroos
      # The guest-dependent tests skip themselves without the CLI, so this
      # install is what makes this job the backend's real coverage: it is the
      # only place the differential and chunk-composition tests execute
      # against native x86-64 hardware.
      - name: Build and install jolt CLI
        run: cargo install --path . --locked --force --profile ci --target-dir target
      - name: Test jolt-tracer-x86
        run: cargo nextest run --cargo-profile ci -p jolt-tracer-x86

  test-prover-zk:
    runs-on: ubuntu-latest
    name: Test jolt-prover (zk)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          components: rust-src
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-tests
          save-if: false
          cache-directories: ~/.cache/dory
      - name: Cache ZeroOS musl toolchain
        id: cache-zeroos-musl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.zeroos/musl
          key: zeroos-musl-toolchain-musl-1.2.3-gcc-9.4.0-Linux-x86_64
      - name: Install ZeroOS musl toolchain
        if: steps.cache-zeroos-musl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/LayerZero-Labs/ZeroOS/releases/download/musl-toolchain-musl-1.2.3-gcc-9.4.0/zeroos-musl-toolchain-musl-1.2.3-gcc-9.4.0-Linux-x86_64.tar.gz -o /tmp/zeroos-musl.tar.gz
          mkdir -p ~/.zeroos
          tar -xzf /tmp/zeroos-musl.tar.gz -C ~/.zeroos
      - name: Build and install jolt CLI
        run: cargo install --path . --locked --force --profile ci --target-dir target
      - name: Install nextest
        uses: taiki-e/install-action@45fceba0fc176f41d2aee1ca9d6598ba628eea62 # nextest
      - name: Run jolt-prover tests with zk feature
        run: cargo nextest run --cargo-profile ci -p jolt-prover --features prover-fixtures,zk
      # The jolt-verifier ZK fixture suites (completeness, tampering, FS
      # attacks, statistical independence, proof shape): real BlindFold proofs
      # from the modular prover, verified through the public API. Until this
      # step existed they were clippy-only, so the golden BlindFold shape pins
      # in completeness/zk.rs could go stale without any lane noticing.
      - name: Run jolt-verifier fixtures with zk feature
        run: cargo nextest run --cargo-profile ci -p jolt-verifier --features prover-fixtures,zk --test-threads 1 --cargo-quiet
      # The jolt-kernels unit suite in its zk flavor.
      - name: Run jolt-kernels tests with zk feature
        run: cargo nextest run --cargo-profile ci -p jolt-kernels --features zk

  test-prover-akita:
    runs-on: ubuntu-latest
    name: Test jolt-prover (akita)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          components: rust-src
          cache: false
      # Sole saver for the release-tests shared cache — largest dependency
      # footprint of the group (host + akita at release).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-tests
          cache-directories: ~/.cache/dory
      - name: Cache ZeroOS musl toolchain
        id: cache-zeroos-musl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.zeroos/musl
          key: zeroos-musl-toolchain-musl-1.2.3-gcc-9.4.0-Linux-x86_64
      - name: Install ZeroOS musl toolchain
        if: steps.cache-zeroos-musl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/LayerZero-Labs/ZeroOS/releases/download/musl-toolchain-musl-1.2.3-gcc-9.4.0/zeroos-musl-toolchain-musl-1.2.3-gcc-9.4.0-Linux-x86_64.tar.gz -o /tmp/zeroos-musl.tar.gz
          mkdir -p ~/.zeroos
          tar -xzf /tmp/zeroos-musl.tar.gz -C ~/.zeroos
      - name: Build and install jolt CLI
        run: cargo install --path . --locked --force --profile ci --target-dir target
      - name: Install nextest
        uses: taiki-e/install-action@45fceba0fc176f41d2aee1ca9d6598ba628eea62 # nextest
      # The Akita arm of the guest x mode matrix plus the packed-prover
      # specifics: forced K=256, advice, committed-program, and live tampers.
      - name: Run jolt-prover tests with akita feature
        run: cargo nextest run --cargo-profile ci -p jolt-prover --features akita,prover-fixtures

  # NOTE: the profiling smoke test (`cargo nextest run -p jolt-prover
  # --features profiling -E 'binary(profiling_smoke)'`) is deliberately not
  # wired into CI yet. It proves through the reference backend, whose naive
  # RAM kernels retain ~18 GiB regardless of trace length — past
  # hosted-runner memory. Hook it up as a dedicated job (guest toolchain +
  # jolt CLI install, mirroring the prover test jobs above) once an
  # optimized backend fits runner memory.

  test-prover-field-inline:
    runs-on: ubuntu-latest
    name: Test jolt-prover (field-inline matrix and e2e)
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rust-src
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-tests
          save-if: false
          cache-directories: ~/.cache/dory
      - name: Cache ZeroOS musl toolchain
        id: cache-zeroos-musl
        uses: actions/cache@v6
        with:
          path: ~/.zeroos/musl
          key: zeroos-musl-toolchain-musl-1.2.3-gcc-9.4.0-Linux-x86_64
      - name: Install ZeroOS musl toolchain
        if: steps.cache-zeroos-musl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/LayerZero-Labs/ZeroOS/releases/download/musl-toolchain-musl-1.2.3-gcc-9.4.0/zeroos-musl-toolchain-musl-1.2.3-gcc-9.4.0-Linux-x86_64.tar.gz -o /tmp/zeroos-musl.tar.gz
          mkdir -p ~/.zeroos
          tar -xzf /tmp/zeroos-musl.tar.gz -C ~/.zeroos
      - name: Build and install jolt CLI
        run: cargo install --path . --locked --force --profile ci --target-dir target
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      # e2e_matrix selects field_ops and muldiv for the field-inline
      # profile. Run the full package to retain its specialized parity and
      # tamper suites alongside matrix acceptance in both Dory modes.
      - name: Run field-inline matrix and specialized suites (clear)
        run: cargo nextest run --cargo-profile ci -p jolt-prover --features prover-fixtures,field-inline
      - name: Run field-inline matrix and specialized suites (zk)
        run: cargo nextest run --cargo-profile ci -p jolt-prover --features prover-fixtures,field-inline,zk
      # The example smoke run (no generic example lane runs feature-gated
      # examples; the ci-bench sweep excludes this one).
      - name: Run the field-ops example
        run: cargo run --profile ci -p field-ops --features field-inline

  test-prover-akita-field-inline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    name: Test jolt-prover (packed field-inline matrix and e2e)
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rust-src,llvm-tools-preview
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-tests
          save-if: false
          cache-directories: ~/.cache/dory
      - name: Cache ZeroOS musl toolchain
        id: cache-zeroos-musl
        uses: actions/cache@v6
        with:
          path: ~/.zeroos/musl
          key: zeroos-musl-toolchain-musl-1.2.3-gcc-9.4.0-Linux-x86_64
      - name: Install ZeroOS musl toolchain
        if: steps.cache-zeroos-musl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/LayerZero-Labs/ZeroOS/releases/download/musl-toolchain-musl-1.2.3-gcc-9.4.0/zeroos-musl-toolchain-musl-1.2.3-gcc-9.4.0-Linux-x86_64.tar.gz -o /tmp/zeroos-musl.tar.gz
          mkdir -p ~/.zeroos
          tar -xzf /tmp/zeroos-musl.tar.gz -C ~/.zeroos
      - name: Build and install jolt CLI
        run: cargo install --path . --locked --force --profile ci --target-dir target
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      # The same field_ops and muldiv matrix table runs over fp128.
      # The full package also runs packed field-inline parity and tamper suites.
      - name: Run packed field-inline matrix and specialized suites
        run: cargo nextest run --cargo-profile ci -p jolt-prover --features prover-fixtures,field-inline,akita
      # The combined-feature verifier unit suite (no fixtures).
      - name: Run jolt-verifier with field-inline,akita
        run: cargo nextest run --cargo-profile ci -p jolt-verifier --features field-inline,akita
      # The combined-feature kernels unit suite: the composed packed field-inline
      # kernels (akita parity tests with the field-inline geometry attached) run only
      # under this pair.
      - name: Run jolt-kernels with field-inline,akita
        run: cargo nextest run --cargo-profile ci -p jolt-kernels --features field-inline,akita
      # The packed field-inline provisioning pins (the field-inline limb arity line against the
      # packing law), and the verifier's packed field-inline fixture suite (the modular
      # packed prover's eq-MLE proof; legacy-generated akita fixtures pin the
      # field-inline axis disabled).
      - name: Run jolt-akita with field-inline
        run: cargo nextest run --cargo-profile ci -p jolt-akita --features field-inline
      - name: Run jolt-verifier with prover-fixtures,field-inline,akita
        run: cargo nextest run --cargo-profile ci -p jolt-verifier --features prover-fixtures,field-inline,akita --test-threads 1
      - name: Build current recursion acceptance tool
        timeout-minutes: 15
        run: |
          CARGO_BUILD_JOBS=1 cargo build --locked --profile ci -p recursion --bin recursion --features akita,field-inline,ntt-inline
          mkdir "$RUNNER_TEMP/recursion-acceptance"
          sha256sum Cargo.lock > "$RUNNER_TEMP/recursion-acceptance/lock.sha256"
          git rev-parse HEAD > "$RUNNER_TEMP/recursion-acceptance/source-head.txt"
          sha256sum "$(command -v jolt)" target/ci/recursion > "$RUNNER_TEMP/recursion-acceptance/host-binaries.sha256"
      - name: Generate and retain actual Akita verifier guest
        timeout-minutes: 15
        env:
          CARGO_BUILD_JOBS: 1
          CARGO_NET_OFFLINE: true
        run: |
          export JOLT_PATH="$(command -v jolt)"
          target/ci/recursion generate --example fibonacci --proofs 1 --workdir "$RUNNER_TEMP/recursion-acceptance/proofs"
          target/ci/recursion prepare-guest --example fibonacci --workdir "$RUNNER_TEMP/recursion-acceptance/proofs" --output "$RUNNER_TEMP/recursion-acceptance/accepted"
          sha256sum -c "$RUNNER_TEMP/recursion-acceptance/lock.sha256"
      - name: Inspect retained guest memory routines
        run: |
          llvm_bin="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin"
          "$llvm_bin/llvm-objdump" -d --no-show-raw-insn --disassemble-symbols=memset "$RUNNER_TEMP/recursion-acceptance/accepted/guest.elf" > "$RUNNER_TEMP/recursion-acceptance/memset.asm"
          "$llvm_bin/llvm-objdump" -d --no-show-raw-insn --disassemble-symbols=memcpy "$RUNNER_TEMP/recursion-acceptance/accepted/guest.elf" > "$RUNNER_TEMP/recursion-acceptance/memcpy.asm"
          python3 - <<'PY'
          import os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'recursion-acceptance'
          memset = (root / 'memset.asm').read_text()
          memcpy = (root / 'memcpy.asm').read_text()
          assert '<memset>:' in memset and '<memcpy>:' in memcpy, 'missing memory routine symbols'
          instructions = [line for line in memset.splitlines() if re.match(r'^\s*[0-9a-f]+:\s', line)]
          assert instructions, 'empty memset disassembly'
          assert not any(re.search(r'\b(call|tail|jal|jalr)\b|<memset>\s*$', line) for line in instructions), 'memset is not a leaf; inspect possible recursive lowering'
          PY
          sha256sum "$RUNNER_TEMP/recursion-acceptance/accepted/guest.elf" "$RUNNER_TEMP/recursion-acceptance/accepted/execution.bin" > "$RUNNER_TEMP/recursion-acceptance/accepted.sha256"
      - name: Execute retained Akita guest acceptance
        timeout-minutes: 15
        run: |
          sha256sum -c "$RUNNER_TEMP/recursion-acceptance/accepted.sha256"
          target/ci/recursion execute-prepared --directory "$RUNNER_TEMP/recursion-acceptance/accepted" --expect accept
          sha256sum -c "$RUNNER_TEMP/recursion-acceptance/accepted.sha256"
      - name: Prepare typed invalid opening with the same guest ELF
        timeout-minutes: 15
        env:
          CARGO_BUILD_JOBS: 1
          CARGO_NET_OFFLINE: true
        run: |
          export JOLT_PATH="$(command -v jolt)"
          target/ci/recursion tamper-opening --example fibonacci --workdir "$RUNNER_TEMP/recursion-acceptance/proofs" --output "$RUNNER_TEMP/recursion-acceptance/invalid-proofs"
          target/ci/recursion prepare-guest --example fibonacci --workdir "$RUNNER_TEMP/recursion-acceptance/invalid-proofs" --output "$RUNNER_TEMP/recursion-acceptance/rejected"
          cmp "$RUNNER_TEMP/recursion-acceptance/accepted/guest.elf" "$RUNNER_TEMP/recursion-acceptance/rejected/guest.elf"
          sha256sum -c "$RUNNER_TEMP/recursion-acceptance/lock.sha256"
          sha256sum "$RUNNER_TEMP/recursion-acceptance/rejected/guest.elf" "$RUNNER_TEMP/recursion-acceptance/rejected/execution.bin" > "$RUNNER_TEMP/recursion-acceptance/rejected.sha256"
      - name: Execute retained Akita guest rejection
        timeout-minutes: 15
        run: |
          sha256sum -c "$RUNNER_TEMP/recursion-acceptance/rejected.sha256"
          target/ci/recursion execute-prepared --directory "$RUNNER_TEMP/recursion-acceptance/rejected" --expect reject
          sha256sum -c "$RUNNER_TEMP/recursion-acceptance/rejected.sha256"
      - name: Retain guest acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recursion-guest-acceptance
          path: ${{ runner.temp }}/recursion-acceptance
          retention-days: 7



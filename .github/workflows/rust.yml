name: Build and Test Jolt

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**", main]
    paths-ignore:
      - "specs/**"
      - "*.md"
      - ".claude/**"

env:
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

# Caching strategy: jobs with near-identical dependency footprints share one
# rust-cache entry (shared-key), and only the job with the largest footprint
# saves it. Entries are saved from main only; pull-request runs restore main's
# entry and never write their own. Per-job caches previously totaled >10 GB,
# and PR-scoped copies of the shared keys still blew the repository quota:
# 5 of the 10 main runs sampled on Sep 27, 2026 started fully cold (34% hit
# rate overall), with every lane recompiling the workspace.
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          components: rustfmt
          cache: false
      - name: cargo fmt
        run: cargo fmt --all --check

  taplo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install taplo
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: taplo-cli
      - name: taplo fmt --check
        run: taplo fmt --check

  style:
    runs-on: ubuntu-latest
    steps:
      # Full history (blobs lazily fetched) so the diff-scoped rules can
      # resolve an exact merge base; see scripts/check_style_invariants.py.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: check style invariants
        run: python3 scripts/check_style_invariants.py --base "origin/${{ github.base_ref || 'main' }}"

  field-stack:
    name: Shared field feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install nextest
        uses: taiki-e/install-action@45fceba0fc176f41d2aee1ca9d6598ba628eea62 # nextest
      - name: Require one jolt-field identity (no akita-field post-cutover)
        run: scripts/check-shared-field-identity.sh
      - name: Check no backend
        run: cargo check -p jolt-field --no-default-features
      - name: Check BN254 backend
        run: cargo check -p jolt-field --no-default-features --features bn254
      - name: Test Solinas backend
        run: cargo nextest run -p jolt-field --no-default-features --features solinas --cargo-quiet
      - name: Test parallel Solinas backend
        run: cargo nextest run -p jolt-field --no-default-features --features solinas,parallel --cargo-quiet
      - name: Check combined backends
        run: cargo check -p jolt-field --no-default-features --features bn254,solinas

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          components: clippy
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy --features allocative,host
        run: cargo clippy --all --all-targets --features allocative,host
      - name: cargo clippy --features allocative,host,zk
        run: cargo clippy --all --all-targets --features allocative,host,zk
      - name: cargo clippy --no-default-features
        run: cargo clippy --all --all-targets --no-default-features
      # jolt-verifier's prover-fixtures feature gates live prover artifact
      # generation for verifier tests. It is not enabled by the workspace-wide
      # invocations above, so build it explicitly in both modes.
      - name: cargo clippy -p jolt-verifier --features prover-fixtures
        run: cargo clippy -p jolt-verifier --all-targets --features prover-fixtures
      - name: cargo clippy -p jolt-verifier --features prover-fixtures,zk
        run: cargo clippy -p jolt-verifier --all-targets --features prover-fixtures,zk
      # The akita feature selects the lattice (Akita) PIOP; it is not enabled
      # by the workspace-wide invocations above.
      - name: cargo clippy -p jolt-verifier --features akita
        run: cargo clippy -p jolt-verifier --all-targets --features akita
      # The akita fixture-driven tamper suite compiles under akita,prover-fixtures
      # (the real packed prover generates its fixtures). Lint it explicitly.
      - name: cargo clippy -p jolt-verifier --features akita,prover-fixtures
        run: cargo clippy -p jolt-verifier --all-targets --features akita,prover-fixtures
      # The modular prover's packed (Akita) path: lint alone and with
      # prover-fixtures so the acceptance suites keep compiling.
      - name: cargo clippy -p jolt-prover --features akita
        run: cargo clippy -p jolt-prover --all-targets --features akita
      - name: cargo clippy -p jolt-prover --features akita,prover-fixtures
        run: cargo clippy -p jolt-prover --all-targets --features akita,prover-fixtures
      # The Dory arms of the guest x mode matrix and the e2e suites compile
      # only under prover-fixtures; lint both protocols like the akita pair.
      - name: cargo clippy -p jolt-prover --features prover-fixtures
        run: cargo clippy -p jolt-prover --all-targets --features prover-fixtures
      - name: cargo clippy -p jolt-prover --features prover-fixtures,zk
        run: cargo clippy -p jolt-prover --all-targets --features prover-fixtures,zk
      # The profiling feature gates the profile harness bin and smoke test.
      # The smoke test cannot RUN in CI yet (reference-backend memory — see
      # the NOTE above the prover test jobs), but everything behind the
      # feature must keep compiling. Lint it in both flamegraph modes.
      - name: cargo clippy -p jolt-prover --features profiling
        run: cargo clippy -p jolt-prover --all-targets --features profiling
      - name: cargo clippy -p jolt-prover --features profiling,allocative
        run: cargo clippy -p jolt-prover --all-targets --features profiling,allocative
      # The packed profile harness: the same bin/smoke test driving
      # akita::prove. Lint both flamegraph modes, like the Dory pair above.
      - name: cargo clippy -p jolt-prover --features akita,profiling
        run: cargo clippy -p jolt-prover --all-targets --features akita,profiling
      - name: cargo clippy -p jolt-prover --features akita,profiling,allocative
        run: cargo clippy -p jolt-prover --all-targets --features akita,profiling,allocative
      # The field-inline feature is not enabled by host/zk/default, so the
      # workspace-wide invocations above never build it. Lint the crates that
      # define it explicitly so the feature keeps compiling.
      - name: cargo clippy --features field-inline
        run: >
          cargo clippy
          -q
          --message-format=short
          -p jolt-claims
          -p jolt-r1cs
          -p tracer
          -p jolt-program
          -p jolt-riscv
          -p jolt-lookup-tables
          --all-targets
          --features field-inline
          --
          -D warnings
      - name: cargo clippy -p jolt-sdk --features host,field-inline
        run: >
          cargo clippy
          -q
          --message-format=short
          -p jolt-sdk
          --all-targets
          --features host,field-inline
          --
          -D warnings

  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bnjbvr/cargo-machete@135555c9cd9f3b4723dee2766f0cacb99aac092b # main
      - name: cargo machete
        run: cargo machete --with-metadata

  build-wasm:
    name: Build Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      # jolt-platform owns the wasm RNG backend (getrandom 0.2 `js`, 0.3
      # `wasm_js`); the SDK and `jolt build-wasm` reach it through
      # `jolt-platform/random`. Build it alongside the prover so feature
      # unification supplies the backend here too, instead of anchoring it in
      # a library crate.
      - name: Build Wasm
        run: RUSTFLAGS='--cfg getrandom_backend="wasm_js"' cargo build -p jolt-prover -p jolt-platform --features jolt-platform/random --release --target wasm32-unknown-unknown

  # The ci-profile test family compiles exactly once. Each lane below builds
  # one nextest archive per test invocation and uploads it; the `cli` lane
  # also installs the jolt CLI (the guest builds inside the tests shell out
  # to it), the SDK fixture generator, and the tracer equivalence harness.
  # The test-release matrix downloads the archives and runs them on fresh
  # runners. Before this job every test lane ran its own `cargo install
  # --path .` plus its own test build: eleven lanes, ~85 runner-minutes of
  # compilation for ~21 minutes of tests.
  #
  # One archive per package x feature set, never one archive per protocol:
  # selecting several packages in one cargo invocation unifies their features
  # (jolt-kernels' serial paths would pick up `parallel` through jolt-verifier,
  # jolt-verifier would gain `prover-fixtures` inside the prover build), so the
  # invocations below stay 1:1 with the commands they replace. Building all of
  # them in one job took 27 min on a 4-vCPU runner (workspace feature variants
  # dominate; rust-cache never stores them), so the archives are spread over
  # lanes that share nothing but dependencies. Lanes keep archives that share
  # workspace variants together (verifier-akita reuses prover-akita's units).
  build-release:
    name: Build release test archives (${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: dory
            cli: true
            archives: |
              prover-dory|-p jolt-prover --features prover-fixtures
              tracer|-p tracer --features test-utils
              tracer-field-inline|-p tracer --features test-utils,field-inline
              tracer-x86|-p jolt-tracer-x86
              sdk|-p jolt-sdk --features host
          - lane: verifier-dory
            archives: |
              verifier-dory|-p jolt-verifier --features prover-fixtures
          - lane: zk
            archives: |
              prover-zk|-p jolt-prover --features prover-fixtures,zk
              verifier-zk|-p jolt-verifier --features prover-fixtures,zk
              kernels-zk|-p jolt-kernels --features zk
          - lane: akita
            archives: |
              prover-akita|-p jolt-prover --features akita,prover-fixtures
              verifier-akita|-p jolt-verifier --features akita,prover-fixtures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          cache: false
      # The cli lane has the broadest dependency footprint and is the sole
      # saver of the release-tests shared cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-tests
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.cli == true }}
      - name: Install nextest
        uses: taiki-e/install-action@45fceba0fc176f41d2aee1ca9d6598ba628eea62 # nextest
      - name: Build and install jolt CLI
        if: matrix.cli
        run: cargo install --path . --locked --force --profile ci --target-dir target
      # `fibonacci --save` generates the SDK verifier fixtures; the
      # trace_equivalence example is the tracer's serial/parallel harness.
      # Both are built here and run in their test jobs.
      - name: Build SDK fixture generator
        if: matrix.cli
        run: cargo build --profile ci -p fibonacci
      - name: Build tracer equivalence harness
        if: matrix.cli
        run: cargo build --profile ci -p tracer --example trace_equivalence
      - name: Stage binaries
        if: matrix.cli
        run: |
          mkdir -p "$RUNNER_TEMP/jolt-bin"
          cp ~/.cargo/bin/jolt target/ci/fibonacci target/ci/examples/trace_equivalence "$RUNNER_TEMP/jolt-bin/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.cli
        with:
          name: jolt-bin
          path: ${{ runner.temp }}/jolt-bin
          if-no-files-found: error
          retention-days: 1
      # Every archive of the lane is attempted even after one fails, so the
      # test jobs of the archives that did build still run; the step (and the
      # jobs of the missing archives) fail.
      - name: Archive release test binaries
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/nextest-archives"
          failed=()
          while IFS='|' read -r name selection; do
            [[ -z "$name" ]] && continue
            echo "::group::${name}: cargo nextest archive ${selection}"
            # shellcheck disable=SC2086
            if ! cargo nextest archive --cargo-profile ci $selection \
                --archive-file "$RUNNER_TEMP/nextest-archives/${name}.tar.zst"; then
              failed+=("$name")
            fi
            echo "::endgroup::"
          done <<< "${{ matrix.archives }}"
          ls -la "$RUNNER_TEMP/nextest-archives"
          if (( ${#failed[@]} )); then
            echo "::error::archives failed to build: ${failed[*]}"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: nextest-archives-${{ matrix.lane }}
          path: ${{ runner.temp }}/nextest-archives
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1

  # Runs the archives built above. Each matrix entry keeps the display name
  # of the lane it replaces; `args` applies to every archive of the entry.
  # The guest toolchain stays installed because the prover tests build their
  # guests at test time through the jolt CLI. `!cancelled()` lets the entries
  # whose archives did build run when another build lane failed.
  test-release:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: build-release
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Test jolt-prover
            archives: prover-dory
          # The dory fixture suite is the longest (~5 min serial), so it is
          # split in two. Both halves keep --test-threads 1: the fixture tests
          # generate shared temp artifacts and use large stacks.
          - name: Test jolt-verifier (prover fixtures) 1/2
            archives: verifier-dory
            args: --test-threads 1 --partition count:1/2
          - name: Test jolt-verifier (prover fixtures) 2/2
            archives: verifier-dory
            args: --test-threads 1 --partition count:2/2
          - name: Test tracer
            archives: tracer tracer-field-inline
          # The only place the differential and chunk-composition tests execute
          # against native x86-64 hardware; the guest-dependent tests skip
          # themselves without the CLI.
          - name: x86 AOT tracer backend (native x86-64)
            archives: tracer-x86
          - name: Jolt SDK Verifier Tests
            archives: sdk
            sdk_fixtures: true
          # jolt-prover's zk suite split in two; the (tiny) jolt-kernels zk
          # suite rides along so both halves together run it in full.
          - name: Test jolt-prover (zk) 1/2
            archives: prover-zk kernels-zk
            args: --partition count:1/2
          - name: Test jolt-prover (zk) 2/2
            archives: prover-zk kernels-zk
            args: --partition count:2/2
          # The jolt-verifier ZK fixture suites (completeness, tampering, FS
          # attacks, statistical independence, proof shape): real BlindFold
          # proofs from the modular prover, verified through the public API.
          - name: Test jolt-verifier (zk fixtures)
            archives: verifier-zk
            args: --test-threads 1
          # The Akita arm of the guest x mode matrix plus the packed-prover
          # specifics: forced K=256, advice, committed-program, and live tampers.
          - name: Test jolt-prover (akita)
            archives: prover-akita
          # The fixture-driven akita suites: valid-fixture acceptance
          # (completeness/akita.rs) and the typed clear-claim, commitment-byte,
          # proof-shape, and presence tamper sweeps (tampering/akita.rs).
          - name: Test jolt-verifier (akita fixtures)
            archives: verifier-akita
            args: --test-threads 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          components: rust-src
          cache: false
      - name: Cache ZeroOS musl toolchain
        id: cache-zeroos-musl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.zeroos/musl
          key: zeroos-musl-toolchain-musl-1.2.3-gcc-9.4.0-Linux-x86_64
      - name: Install ZeroOS musl toolchain
        if: steps.cache-zeroos-musl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/LayerZero-Labs/ZeroOS/releases/download/musl-toolchain-musl-1.2.3-gcc-9.4.0/zeroos-musl-toolchain-musl-1.2.3-gcc-9.4.0-Linux-x86_64.tar.gz -o /tmp/zeroos-musl.tar.gz
          mkdir -p ~/.zeroos
          tar -xzf /tmp/zeroos-musl.tar.gz -C ~/.zeroos
      - name: Install nextest
        uses: taiki-e/install-action@45fceba0fc176f41d2aee1ca9d6598ba628eea62 # nextest
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: jolt-bin
          path: ${{ runner.temp }}/jolt-bin
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: nextest-archives-*
          merge-multiple: true
          path: ${{ runner.temp }}/nextest-archives
      # Artifacts drop the executable bit.
      - name: Install jolt CLI
        run: install -m 0755 "$RUNNER_TEMP/jolt-bin/jolt" ~/.cargo/bin/jolt
      - name: Generate SDK fixtures
        if: matrix.sdk_fixtures
        run: |
          chmod +x "$RUNNER_TEMP/jolt-bin/fibonacci"
          FIBONACCI_BIN="$RUNNER_TEMP/jolt-bin/fibonacci" bash jolt-sdk/tests/gen-fixtures.sh
      - name: Run tests from archives
        shell: bash
        run: |
          set -euo pipefail
          for archive in ${{ matrix.archives }}; do
            file="$RUNNER_TEMP/nextest-archives/${archive}.tar.zst"
            if [[ ! -f "$file" ]]; then
              echo "::error::archive ${archive} is missing: its build lane failed"
              exit 1
            fi
            cargo nextest run --archive-file "$file" --workspace-remap "$GITHUB_WORKSPACE" ${{ matrix.args }}
          done

  trace-equivalence:
    runs-on: ubuntu-latest
    name: Tracer serial/parallel equivalence
    needs: build-release
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          components: rust-src
          cache: false
      - name: Cache ZeroOS musl toolchain
        id: cache-zeroos-musl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.zeroos/musl
          key: zeroos-musl-toolchain-musl-1.2.3-gcc-9.4.0-Linux-x86_64
      - name: Install ZeroOS musl toolchain
        if: steps.cache-zeroos-musl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/LayerZero-Labs/ZeroOS/releases/download/musl-toolchain-musl-1.2.3-gcc-9.4.0/zeroos-musl-toolchain-musl-1.2.3-gcc-9.4.0-Linux-x86_64.tar.gz -o /tmp/zeroos-musl.tar.gz
          mkdir -p ~/.zeroos
          tar -xzf /tmp/zeroos-musl.tar.gz -C ~/.zeroos
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: jolt-bin
          path: ${{ runner.temp }}/jolt-bin
      - name: Install jolt CLI
        run: install -m 0755 "$RUNNER_TEMP/jolt-bin/jolt" ~/.cargo/bin/jolt
      # Every parallel configuration must produce byte-identical output to the
      # serial interpreter. The harness runs each configuration in a child
      # process and compares within the run, so there are no committed hashes
      # to re-record.
      - name: Serial/parallel trace equivalence
        run: |
          chmod +x "$RUNNER_TEMP/jolt-bin/trace_equivalence"
          "$RUNNER_TEMP/jolt-bin/trace_equivalence"

  # NOTE: the profiling smoke test (`cargo nextest run -p jolt-prover
  # --features profiling -E 'binary(profiling_smoke)'`) is deliberately not
  # wired into CI yet. It proves through the reference backend, whose naive
  # RAM kernels retain ~18 GiB regardless of trace length — past
  # hosted-runner memory. Hook it up as another build-release archive once an
  # optimized backend fits runner memory.

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@512fc24f32f44ab01972217aaaf3dc86ec234d53 # v1.50.2
        with:
          files: .

  test-sdk:
    name: jolt binary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-tests
          save-if: false
      - name: Build and install jolt CLI
        run: cargo install --path . --locked --force --profile ci --target-dir target

      - name: Use the `jolt` binary to generate code
        run: jolt new sample_project

      - name: Pin jolt-sdk to current commit in Cargo.toml files
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)
          # Pin jolt-sdk in the host Cargo.toml
          sed -i 's|jolt-sdk = { git = "https://github.com/a16z/jolt", features = \["host"\] }|jolt-sdk = { git = "https://github.com/a16z/jolt", rev = "'$COMMIT_HASH'", features = ["host"] }|' sample_project/Cargo.toml
          # Pin jolt-sdk in the guest Cargo.toml
          sed -i 's|jolt = { package = "jolt-sdk", git = "https://github.com/a16z/jolt" }|jolt = { package = "jolt-sdk", git = "https://github.com/a16z/jolt", rev = "'$COMMIT_HASH'" }|' sample_project/guest/Cargo.toml

      - name: Make sure the generated code runs
        working-directory: ./sample_project
        run: cargo run --release

      - name: Make sure the generated code runs with field-inline
        working-directory: ./sample_project
        run: cargo run --release -q --message-format=short --features field-inline

  test-wasm-verify:
    name: WASM Verifier E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-tests
          save-if: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Build and install jolt CLI
        run: cargo install --path . --locked --force --profile ci --target-dir target

      - name: Cache wasm-pack
        id: cache-wasm-pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.13.1
      - name: Install wasm-pack
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'
        run: curl -sSL https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz | tar -xz --strip-components=1 -C ~/.cargo/bin
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Generate sample project
        run: jolt new sample_project

      - name: Pin jolt-sdk to current commit
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)
          sed -i 's|jolt-sdk = { git = "https://github.com/a16z/jolt", features = \["host"\] }|jolt-sdk = { git = "https://github.com/a16z/jolt", rev = "'$COMMIT_HASH'", features = ["host"] }|' sample_project/Cargo.toml
          sed -i 's|jolt = { package = "jolt-sdk", git = "https://github.com/a16z/jolt" }|jolt = { package = "jolt-sdk", git = "https://github.com/a16z/jolt", rev = "'$COMMIT_HASH'" }|' sample_project/guest/Cargo.toml

      - name: Set up prover and verifier scripts
        run: |
          cp scripts/ci/wasm-e2e/prove_and_save.rs sample_project/src/main.rs
          cp scripts/ci/wasm-e2e/verify.mjs sample_project/verify.mjs

      - name: Prove natively and save artifacts
        working-directory: ./sample_project
        run: cargo run --release

      - name: Build WASM verifier
        working-directory: ./sample_project
        run: jolt build-wasm

      - name: Verify proof in WASM
        working-directory: ./sample_project
        run: node verify.mjs

  # Sharded: the sequential per-crate loop was the CI critical path
  # (~18 min). Crates are assigned to shards by discovery index; each crate
  # keeps its own nextest invocation so per-crate feature resolution is
  # unchanged. jolt-akita's optimized test build alone takes 10-14 min on a
  # 4-vCPU runner (measured Sep 27, 2026) and made shard 0 the critical path
  # of the whole run, so it gets a shard of its own.
  test-crates-shard:
    name: Test modular crates (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, akita]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: dev-tests-${{ matrix.shard }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install nextest
        uses: taiki-e/install-action@45fceba0fc176f41d2aee1ca9d6598ba628eea62 # nextest
      - name: Discover modular crates
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          pkgs=$(cargo metadata --format-version=1 --no-deps \
                   | jq -r '.packages[] | select(.manifest_path | startswith("'"$(pwd)"'/crates/")) | .name' \
                   | tr '\n' ' ')
          echo "Found crates: $pkgs"
          echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"
      - name: Test each crate
        shell: bash
        run: |
          set -euo pipefail
          i=0
          for pkg in ${{ steps.discover.outputs.pkgs }}; do
            if [[ "$pkg" == jolt-akita ]]; then
              shard=akita
            else
              shard=$(( i % 3 ))
            fi
            i=$((i + 1))
            if [[ "$shard" == "${{ matrix.shard }}" ]]; then
              features=()
              if cargo metadata --format-version=1 --no-deps \
                   | jq -e --arg pkg "$pkg" '.packages[] | select(.name == $pkg) | .features | has("test-utils")' >/dev/null; then
                features=(--features test-utils)
              fi
              cargo nextest run -p "$pkg" "${features[@]}" --no-tests=pass
            fi
          done
      # jolt-witness's parallel feature is not a default, so the shard loop
      # above tests only the serial paths; the shipped provers enable it
      # (via jolt-kernels' default), so test the rayon fast paths directly.
      - name: Test jolt-witness with parallel
        if: matrix.shard == 2
        run: cargo nextest run -p jolt-witness --features test-utils,parallel --cargo-quiet
      # Same non-default-parallel pattern: jolt-utils' latch/collector tests
      # only exist behind its parallel feature.
      - name: Test jolt-utils with parallel
        if: matrix.shard == 2
        run: cargo nextest run -p jolt-utils --features parallel --cargo-quiet
      - name: Test jolt-sumcheck with committed proofs
        if: matrix.shard == 0
        run: cargo nextest run -p jolt-sumcheck --features committed --cargo-quiet
      - name: Test isolated external sumcheck consumer
        if: matrix.shard == 0
        run: cargo nextest run --manifest-path crates/jolt-sumcheck/tests/external-consumer/Cargo.toml --locked --cargo-quiet
      - name: Check external sumcheck dependency boundary
        if: matrix.shard == 0
        run: scripts/check-external-sumcheck.sh
      - name: Test jolt-verifier with akita feature
        if: matrix.shard == 1
        run: cargo nextest run -p jolt-verifier --features akita --no-tests=pass --cargo-quiet
      - name: Test crates with field-inline
        if: matrix.shard == 1
        shell: bash
        run: |
          set -euo pipefail
          cargo nextest run -p jolt-claims -p jolt-r1cs \
            -p jolt-program -p jolt-riscv -p jolt-lookup-tables \
            --features field-inline --no-tests=pass --cargo-quiet

  # Join gate so the check name "Test modular crates" is stable regardless of
  # shard count.
  test-crates:
    name: Test modular crates
    runs-on: ubuntu-latest
    needs: test-crates-shard
    if: always()
    steps:
      - name: Check shard results
        run: |
          if [ "${{ needs.test-crates-shard.result }}" != "success" ]; then
            echo "Shard result: ${{ needs.test-crates-shard.result }}"
            exit 1
          fi

  test-inlines:
    name: Test inlines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: dev-inlines
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install nextest
        uses: taiki-e/install-action@45fceba0fc176f41d2aee1ca9d6598ba628eea62 # nextest
      - name: Discover inline crates
        id: discover_inlines
        shell: bash
        run: |
          set -euo pipefail
          pkgs=$(cargo metadata --format-version=1 --no-deps \
                   | jq -r '.packages[].name' \
                   | grep '^jolt-inlines-' \
                   | tr '\n' ' ')
          echo "Found inline crates: $pkgs"
          echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"
      - name: Test each inline crate (host)
        shell: bash
        run: |
          set -euo pipefail
          for pkg in ${{ steps.discover_inlines.outputs.pkgs }}; do
            cargo nextest run --features host -p "$pkg" --no-tests=pass
          done

  zklean-extractor-tests:
    name: ZkLean extractor tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nextest
        uses: taiki-e/install-action@45fceba0fc176f41d2aee1ca9d6598ba628eea62 # nextest
      - name: Run extractor tests
        working-directory: ./zklean-extractor
        run: cargo nextest run --cargo-quiet

  compile-extracted-lean:
    name: Compile extracted Lean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract Jolt ZkLean package
        working-directory: ./zklean-extractor
        run: cargo run --release -- -o -p jolt-zklean


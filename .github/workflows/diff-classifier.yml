# Classifies the diff into actual code / tests / docs / fixtures
# (scripts/ci/diff_classifier.py) and writes the result to the job summary.
# Informational only: the job never fails the PR — classification errors
# degrade to a note in the job summary. Its token is read-only; when a run
# completes, diff-classifier-comment.yml posts the sticky PR comment from the
# default branch.
name: PR Diff Classification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # blob:none keeps the full-history fetch small (commits + trees only);
      # the classifier needs real history for an exact merge-base, and git
      # lazily batch-fetches just the blobs the diff touches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Classify diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if python3 scripts/ci/diff_classifier.py \
              --base "origin/${BASE_REF}" \
              --head "${HEAD_SHA}" \
              --format markdown \
              --details \
              --output "${RUNNER_TEMP}/diff-classifier.md"; then
            cat "${RUNNER_TEMP}/diff-classifier.md" >> "$GITHUB_STEP_SUMMARY"
          else
            # Never fail the PR on classification errors.
            echo "Diff classification failed." >> "$GITHUB_STEP_SUMMARY"
          fi

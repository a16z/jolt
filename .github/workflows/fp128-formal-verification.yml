name: Fp128 formal verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fp128-formal-verification.yml"
      - "crates/jolt-algebra/**"
      - "proofs/hol-light/**"
      - "scripts/check_fp128_proof_artifacts.py"
      - "scripts/tests/test_check_fp128_proof_artifacts.py"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".cargo/**"
  pull_request:
    paths:
      - ".github/workflows/fp128-formal-verification.yml"
      - "crates/jolt-algebra/**"
      - "proofs/hol-light/**"
      - "scripts/check_fp128_proof_artifacts.py"
      - "scripts/tests/test_check_fp128_proof_artifacts.py"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "!**/*.md"

permissions:
  contents: read

env:
  FUZZ_TOOLCHAIN: nightly-2026-08-24

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fp128-asm-fuzz-aarch64:
    name: Differential fuzz AArch64 assembly
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
          cache: false
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-fuzz
      - name: Compare assembly with portable arithmetic
        working-directory: crates/jolt-algebra
        run: cargo +"${FUZZ_TOOLCHAIN}" fuzz run --target aarch64-unknown-linux-gnu fp128_asm_differential -- -max_total_time=120

  fp128-asm-fuzz-x86-64-bmi2-adx:
    name: Differential fuzz x86-64 BMI2+ADX assembly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
          cache: false
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-fuzz
      - name: Require BMI2 and ADX
        run: |
          grep -Eq '(^|[[:space:]])bmi2([[:space:]]|$)' /proc/cpuinfo
          grep -Eq '(^|[[:space:]])adx([[:space:]]|$)' /proc/cpuinfo
      - name: Compare assembly with portable arithmetic
        working-directory: crates/jolt-algebra
        env:
          RUSTFLAGS: -C target-feature=+bmi2,+adx
        run: cargo +"${FUZZ_TOOLCHAIN}" fuzz run --target x86_64-unknown-linux-gnu fp128_asm_differential -- -max_total_time=120

  fp128-proof:
    name: Prove ${{ matrix.label }} add, sub, and mul
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: aarch64
            label: AArch64
            runner: ubuntu-24.04-arm
          - architecture: x86_64
            label: x86-64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          cache: false

      - name: Install proof dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgmp-dev libpcre2-dev libstring-shellquote-perl llvm ocaml opam xdot
          opam init --bare --disable-sandboxing --yes

      - name: Check out pinned s2n-bignum
        run: |
          git clone https://github.com/awslabs/s2n-bignum.git "$RUNNER_TEMP/s2n-bignum"
          git -C "$RUNNER_TEMP/s2n-bignum" checkout ac31a43db30953037abd1b64b540e65cf31f4c67

      - name: Key the HOL Light build
        id: hol-light-key
        run: |
          key=$(./proofs/hol-light/build-hol-light.sh --cache-key)
          echo "key=hol-light-$key" >> "$GITHUB_OUTPUT"

      - name: Restore the HOL Light build
        id: hol-light
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/hol-light
          key: ${{ steps.hol-light-key.outputs.key }}

      - name: Build HOL Light as an OCaml module
        if: steps.hol-light.outputs.cache-hit != 'true'
        run: ./proofs/hol-light/build-hol-light.sh "$RUNNER_TEMP/hol-light"

      # An entry saved from a pull request can be restored only by that pull
      # request, and it evicts main's entries from the repository cache quota.
      - name: Save the HOL Light build
        if: steps.hol-light.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/hol-light
          key: ${{ steps.hol-light-key.outputs.key }}

      - name: Check public bytes and run HOL Light proofs
        env:
          HOL_LIGHT_DIR: ${{ runner.temp }}/hol-light
          S2N_BIGNUM_DIR: ${{ runner.temp }}/s2n-bignum
        run: ./proofs/hol-light/check.sh all ${{ matrix.architecture }} --clean

name: End-to-end prover benchmark requests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'
      - 'book/**'
      - 'specs/**'
      - '.claude/**'

permissions:
  contents: read

concurrency:
  group: e2e-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Check benchmark contracts without proving
        run: uv run --no-project python -m unittest scripts.tests.test_e2e_bench scripts.tests.test_e2e_ci scripts.tests.test_e2e_publication -v
      - name: Report runner enablement
        env:
          ENABLED: ${{ vars.JOLT_E2E_ENABLED }}
        run: |
          if [ "$ENABLED" = true ]; then
            echo 'The default-branch producer will validate this request. Fork PRs cannot use the benchmark runner.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Target execution is disabled. An administrator must complete scripts/bench/README.md before enabling it.' >> "$GITHUB_STEP_SUMMARY"
          fi

  build-only:
    needs: request
    if: github.event.pull_request.number == 2215 && github.event.pull_request.head.repo.full_name == github.repository && vars.JOLT_E2E_ENABLED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Pin the PR merge, its base, and the build-only harness
        run: uv run --no-project python scripts/bench/ci.py plan --build-only --out "$RUNNER_TEMP/e2e-plan"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: jolt-e2e-build-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-plan/plan.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          components: rust-src
          cache: false
      - name: Build artifacts without target execution or credentials
        id: prepare
        run: uv run --no-project python scripts/bench/ci.py prepare --plan "$RUNNER_TEMP/e2e-plan/plan.json" --out "$RUNNER_TEMP/e2e-builds"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: jolt-e2e-builds-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-builds
          if-no-files-found: warn
          retention-days: 14
      - name: Record the build index digest
        env:
          INDEX_SHA256: ${{ steps.prepare.outputs.index_sha256 }}
        run: |
          printf 'Build index SHA256: %s\n' "$INDEX_SHA256" | tee -a "$GITHUB_STEP_SUMMARY"

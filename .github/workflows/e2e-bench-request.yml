name: End-to-end prover benchmark contracts

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '**'
      - '!**/*.md'
      - '!book/**'
      - '!specs/**'
      - '!.claude/**'
      # scripts.tests.test_e2e_calibration checks this file's thresholds table against the code.
      - 'scripts/bench/README.md'

permissions:
  contents: read

concurrency:
  group: e2e-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Check benchmark contracts without proving
        run: uv run --no-project python -m unittest scripts.tests.test_e2e_bench scripts.tests.test_e2e_ci scripts.tests.test_e2e_publication scripts.tests.test_e2e_entry scripts.tests.test_e2e_ingest scripts.tests.test_e2e_calibration -v
      - name: Report App execution enablement
        env:
          ENABLED: ${{ vars.JOLT_E2E_ENABLED }}
        run: |
          if [ "$ENABLED" = true ]; then
            echo 'Benchmarking requires a maintainer-applied benchmark label. The trusted workflow plans the run and the Pika App rechecks admission before dispatch; this job cannot authorize execution.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Ordinary target execution is disabled. Complete host/operator and Pika App setup plus the main-only calibration bootstrap acceptance in scripts/bench/README.md; a maintainer can then enable JOLT_E2E_ENABLED.' >> "$GITHUB_STEP_SUMMARY"
          fi

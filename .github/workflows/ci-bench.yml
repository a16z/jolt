name: CI Benchmarks

on:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

permissions:
  # deployments permission to deploy GitHub pages website
  deployments: write
  # contents permission to update benchmark contents in gh-pages branch
  contents: write

jobs:
  benchmark:
    name: Performance benchmarks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install RISC-V cross-compiler
        run: sudo apt-get install -y gcc-riscv64-unknown-elf
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          cache: false

      - name: Install rust-src
        run: rustup component add rust-src

      - name: Build and install jolt CLI
        run: cargo install --path . --locked --force

      - name: Run benchmark
        run: |
          cd examples
          ./run_ci_benchmarks.sh
          cd ..

      - name: Publish benchmark result
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1
        with:
          name: Benchmarks
          tool: "customSmallerIsBetter"
          output-file-path: examples/benchmark_results.json
          # Access token to deploy GitHub Pages branch
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Push and deploy GitHub pages branch automatically
          auto-push: true

name: EVM Blake parity

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/evm-blake.yml'
      - 'evm/blake-transcript/**'
      - 'crates/jolt-transcript/**'
      - 'crates/jolt-field/**'
      - 'crates/jolt-spartan-prover/**'
      - 'crates/jolt-spartan-verifier/**'
      - 'crates/jolt-hyperkzg/**'
      - 'crates/jolt-crypto/**'
      - 'crates/jolt-openings/**'
      - 'crates/jolt-poly/**'
      - 'crates/jolt-r1cs/**'
      - 'crates/jolt-sumcheck/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: evm/blake-transcript/package-lock.json
      - name: Regenerate the native oracle
        run: |
          cargo run --locked --quiet -p jolt-transcript --no-default-features --features bn254,transcript-blake2b --example evm_blake_vectors > "$RUNNER_TEMP/evm-blake-vectors.json"
          diff -u evm/blake-transcript/test/native-vectors.json "$RUNNER_TEMP/evm-blake-vectors.json"
      - name: Install pinned EVM tools
        working-directory: evm/blake-transcript
        run: npm ci --ignore-scripts
      - name: Check native parity and explicit reverts
        working-directory: evm/blake-transcript
        run: npm test
      - name: Regenerate native Spartan fixtures
        run: |
          cargo run --locked --quiet -p jolt-spartan-prover --features preprocessed --example evm_spartan_vectors -- "$RUNNER_TEMP/evm-spartan-vectors"
          for fixture in toy empty empty-public zero-products; do
            diff -ru "evm/blake-transcript/test/spartan/$fixture" "$RUNNER_TEMP/evm-spartan-vectors/$fixture"
          done
      - name: Check independent Blake256 references
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          from pathlib import Path
          vectors = json.loads(Path("evm/blake-transcript/test/spartan/blake256.json").read_text())
          for vector in vectors:
              actual = hashlib.blake2b(bytes.fromhex(vector["input"]), digest_size=32).hexdigest()
              assert actual == vector["digest"], vector["input"]
          PYTHON
      - name: Check canonical decoding and precompile failures
        working-directory: evm/blake-transcript
        run: |
          npm run test:spartan
          npm run test:spartan-failures
          npm run test:spartan-public-opening
      - name: Check fixed module policy and complete verification
        working-directory: evm/blake-transcript
        run: |
          npm run compile:spartan-modules
          npm run test:spartan-complete
          npm run measure:spartan-norm

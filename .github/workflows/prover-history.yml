name: Publish prover benchmark history

on:
  workflow_run:
    workflows: [End-to-end prover benchmarks, CI Benchmarks]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/prover-history.yml
      - scripts/ci/benchmark_history.py
      - scripts/tests/test_benchmark_history*.py
      - web/benchmarks/**
      - book/src/usage/profiling/benchmark_history.md
  workflow_dispatch:
    inputs:
      run_id:
        description: Producer run to archive; leave empty to redeploy the existing site
        type: string
      run_attempt:
        description: Producer attempt to archive (each attempt is retained separately)
        type: string
        default: '1'

permissions: {}

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      - run: uv run --no-project python -m unittest scripts.tests.test_benchmark_history -v
      # WebKit 27.2 reports false CSP errors for native selects: microsoft/playwright#43617.
      - run: uv run --no-project --with playwright==1.61.0 playwright install --with-deps webkit
      - run: uv run --no-project --with playwright==1.61.0 python -m unittest scripts.tests.test_benchmark_history_browser -v

  publish:
    if: >-
      vars.JOLT_BENCH_PAGES_ENABLED == 'true' &&
      github.repository == 'a16z/jolt' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event) &&
        (github.event.workflow_run.path == '.github/workflows/ci-bench.yml' ||
         (vars.JOLT_BENCH_HISTORY_ENABLED == 'true' && github.event.workflow_run.path == '.github/workflows/e2e-bench.yml'))) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
        (inputs.run_id == '' || vars.JOLT_BENCH_HISTORY_ENABLED == 'true')))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: jolt-benchmark-history-publication
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      - name: Require the admin-configured Pages source
        run: |
          test "$(gh api repos/a16z/jolt/pages --jq .build_type)" = workflow
      - name: Collect the producer attempt as data
        if: >-
          vars.JOLT_BENCH_HISTORY_ENABLED == 'true' &&
          ((github.event_name == 'workflow_run' && github.event.workflow_run.path == '.github/workflows/e2e-bench.yml') ||
           (github.event_name == 'workflow_dispatch' && inputs.run_id != ''))
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.run_attempt }}
        run: |
          uv run --no-project python source/scripts/ci/benchmark_history.py collect \
            --run-id "$SOURCE_RUN_ID" --attempt "$SOURCE_RUN_ATTEMPT" \
            --publisher-revision "$(git -C source rev-parse HEAD)" \
            --out "$RUNNER_TEMP/benchmark-record"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: site
      - name: Append history without replacing legacy files
        if: >-
          vars.JOLT_BENCH_HISTORY_ENABLED == 'true' &&
          ((github.event_name == 'workflow_run' && github.event.workflow_run.path == '.github/workflows/e2e-bench.yml') ||
           github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          record_args=()
          if [[ -f "$RUNNER_TEMP/benchmark-record/receipt.json" ]]; then
            record_args=(--record "$RUNNER_TEMP/benchmark-record")
          fi
          for attempt in 1 2 3 4 5; do
            git -C site fetch origin gh-pages
            git -C site reset --hard FETCH_HEAD
            uv run --no-project python source/scripts/ci/benchmark_history.py append \
              --site site "${record_args[@]}"
            git -C site add -- dev/prover-history
            if git -C site diff --cached --quiet; then
              break
            fi
            git -C site -c user.name=github-actions\[bot\] \
              -c user.email=41898282+github-actions\[bot\]@users.noreply.github.com \
              commit -m "chore(bench): archive prover benchmark run"
            if git -C site push origin HEAD:refs/heads/gh-pages; then
              break
            fi
            if [[ "$attempt" == 5 ]]; then
              exit 1
            fi
          done
      - name: Upload the whole existing public site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

name: Publish prover benchmark history

on:
  workflow_run:
    workflows: [End-to-end benchmark ingest]
    types: [completed]
  pull_request:
    paths:
      - .github/workflows/prover-history.yml
      - scripts/ci/benchmark_history.py
      - scripts/tests/test_benchmark_history*.py
      - web/benchmarks/**
      - book/src/usage/profiling/benchmark_history.md
  workflow_dispatch:
    inputs:
      run_id:
        description: Ingest run to archive; leave empty to redeploy the existing site
        type: string
      run_attempt:
        description: Ingest attempt to archive (each attempt is retained separately)
        type: string
        default: '1'

permissions: {}

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      - run: uv run --no-project python -m unittest scripts.tests.test_benchmark_history -v
      - run: uv run --no-project --with playwright==1.61.0 playwright install --with-deps chromium
      - run: uv run --no-project --with playwright==1.61.0 python -m unittest scripts.tests.test_benchmark_history_browser -v

  publish:
    if: >-
      github.repository == 'a16z/jolt' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.actor.login == '0xandoroid-ai-agent[bot]' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.path == '.github/workflows/e2e-bench-ingest.yml') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      pages: write
    concurrency:
      group: jolt-benchmark-history-publication
      queue: max
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      - name: Check the existing branch-based Pages source without changing it
        run: |
          gh api repos/a16z/jolt/pages --jq '{build_type, source}' > "$RUNNER_TEMP/pages-source.json"
          jq -e '.build_type == "legacy" and .source.branch == "gh-pages" and .source.path == "/"' "$RUNNER_TEMP/pages-source.json"
      - name: Collect the producer attempt as data
        if: >-
          github.event_name == 'workflow_run' || inputs.run_id != ''
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.run_attempt }}
        run: |
          uv run --no-project python source/scripts/ci/benchmark_history.py collect \
            --run-id "$SOURCE_RUN_ID" --attempt "$SOURCE_RUN_ATTEMPT" \
            --publisher-revision "$(git -C source rev-parse HEAD)" \
            --out "$RUNNER_TEMP/benchmark-record"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: site
      - name: Append history without replacing legacy files
        shell: bash
        run: |
          record_args=()
          if [[ -f "$RUNNER_TEMP/benchmark-record/receipt.json" ]]; then
            record_args=(--record "$RUNNER_TEMP/benchmark-record")
          fi
          for attempt in 1 2 3 4 5; do
            git -C site fetch origin gh-pages
            git -C site reset --hard FETCH_HEAD
            uv run --no-project python source/scripts/ci/benchmark_history.py append \
              --site site "${record_args[@]}"
            git -C site add -- dev/prover-history
            if git -C site diff --cached --quiet; then
              break
            fi
            git -C site -c user.name=github-actions\[bot\] \
              -c user.email=41898282+github-actions\[bot\]@users.noreply.github.com \
              commit -m "chore(bench): archive prover benchmark run"
            if git -C site push origin HEAD:refs/heads/gh-pages; then
              break
            fi
            if [[ "$attempt" == 5 ]]; then
              exit 1
            fi
          done
      - name: Verify a published calibration bootstrap through trusted ingest artifacts
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.run_attempt }}
        run: |
          if [[ -f "$RUNNER_TEMP/benchmark-record/receipt.json" ]] &&
             jq -e 'any(.[]; .bootstrap == true)' "$RUNNER_TEMP/benchmark-record/receipt.json" > /dev/null; then
            uv run --no-project python source/scripts/bench/publication.py verify-calibration \
              --ingest-run-id "$SOURCE_RUN_ID" --ingest-run-attempt "$SOURCE_RUN_ATTEMPT"
          fi
      - name: Request a build of the existing Pages site
        run: gh api --method POST repos/a16z/jolt/pages/builds

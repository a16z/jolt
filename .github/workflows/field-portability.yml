name: Field portability

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/field-portability.yml"
      - "crates/jolt-field/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
  # No base-branch filter: a stacked pull request changes these paths too.
  pull_request:
    paths:
      - ".github/workflows/field-portability.yml"
      - "crates/jolt-field/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  binary-x86:
    name: Binary fields on x86_64 (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - feature: +pclmulqdq
            kernel: true
          - feature: -pclmulqdq
            kernel: false
    env:
      RUSTFLAGS: -D warnings -C target-feature=${{ matrix.feature }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      - name: Install nextest
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2
        with:
          tool: nextest
      - name: Require native x86_64 carry-less multiply
        run: |
          test "$(uname -m)" = "x86_64"
          grep -Eq '(^|[[:space:]])pclmulqdq([[:space:]]|$)' /proc/cpuinfo
      - name: Clippy binary backend
        run: |
          cargo clippy -p jolt-field --all-targets --no-default-features --features binary
          cargo clippy -p jolt-field --all-targets --no-default-features --features binary,allocative
          cargo clippy -p jolt-field --all-targets --features solinas,binary,allocative
      - name: Require kernel differential test discovery
        if: matrix.kernel
        run: |
          cargo nextest list -p jolt-field --no-default-features --features binary --cargo-quiet --lib --message-format json > /tmp/binary-tests.json
          python3 -c 'import json; suites = json.load(open("/tmp/binary-tests.json"))["rust-suites"]; assert any("binary::tests::kernel_matches_portable" in suite["testcases"] for suite in suites.values()), "binary kernel differential test was not discovered"'
      - name: Run whole binary field suite
        run: cargo nextest run -p jolt-field --no-default-features --features binary --cargo-quiet

  binary-aarch64:
    name: Binary fields on AArch64 (${{ matrix.feature }})
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - feature: +aes
            kernel: true
          - feature: -aes
            kernel: false
    env:
      RUSTFLAGS: -D warnings -C target-feature=${{ matrix.feature }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      - name: Install nextest
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2
        with:
          tool: nextest
      - name: Require native AArch64 polynomial multiply
        run: |
          test "$(uname -m)" = "aarch64"
          grep -Eq '(^|[[:space:]])aes([[:space:]]|$)' /proc/cpuinfo
          grep -Eq '(^|[[:space:]])pmull([[:space:]]|$)' /proc/cpuinfo
      - name: Clippy binary backend
        run: |
          cargo clippy -p jolt-field --all-targets --no-default-features --features binary
          cargo clippy -p jolt-field --all-targets --no-default-features --features binary,allocative
          cargo clippy -p jolt-field --all-targets --features solinas,binary,allocative
      - name: Require kernel differential test discovery
        if: matrix.kernel
        run: |
          cargo nextest list -p jolt-field --no-default-features --features binary --cargo-quiet --lib --message-format json > /tmp/binary-tests.json
          python3 -c 'import json; suites = json.load(open("/tmp/binary-tests.json"))["rust-suites"]; assert any("binary::tests::kernel_matches_portable" in suite["testcases"] for suite in suites.values()), "binary kernel differential test was not discovered"'
      - name: Run whole binary field suite
        run: cargo nextest run -p jolt-field --no-default-features --features binary --cargo-quiet

  avx2:
    name: AVX2 field kernels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      - name: Install nextest
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2
        with:
          tool: nextest
      - name: Require AVX2
        run: grep -Eq '(^|[[:space:]])avx2([[:space:]]|$)' /proc/cpuinfo
      - name: Run packed field tests
        env:
          RUSTFLAGS: -D warnings -C target-feature=+avx2
        run: cargo nextest run --release -p jolt-field --no-default-features --features solinas,asm --test solinas_packed_differential
      - name: Compare scalar Fp128 assembly with portable arithmetic
        env:
          RUSTFLAGS: -D warnings -C target-feature=+avx2
        run: cargo nextest run --release -p jolt-field --no-default-features --features solinas,asm --lib -E 'test(fp128_asm_matches_portable)'

  aarch64-neon:
    name: AArch64 NEON field kernels
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      - name: Install nextest
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2
        with:
          tool: nextest
      - name: Require native AArch64 NEON
        run: |
          test "$(uname -m)" = "aarch64"
          grep -Eq '(^|[[:space:]])(asimd|neon)([[:space:]]|$)' /proc/cpuinfo
      - name: Run packed field tests
        env:
          RUSTFLAGS: -D warnings -C target-cpu=native
        run: cargo nextest run --release -p jolt-field --no-default-features --features solinas,asm --test solinas_packed_differential
      - name: Compare scalar Fp128 assembly with portable arithmetic
        env:
          RUSTFLAGS: -D warnings -C target-cpu=native
        run: cargo nextest run --release -p jolt-field --no-default-features --features solinas,asm --lib -E 'test(fp128_asm_matches_portable)'

  avx512:
    name: AVX-512 field kernels (emulated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      - name: Install nextest
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2
        with:
          tool: nextest
      - name: Install Intel Software Development Emulator
        run: |
          curl --fail --location --silent --show-error --output /tmp/intel-sde.tar.xz https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz
          echo '94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50  /tmp/intel-sde.tar.xz' | sha256sum --check
          sudo mkdir --parents /opt/intel-sde
          sudo tar --extract --xz --file /tmp/intel-sde.tar.xz --strip-components=1 --directory /opt/intel-sde
          sudo sysctl --write kernel.yama.ptrace_scope=0
      - name: Run packed field tests under emulation
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: /opt/intel-sde/sde64 -icx --
          RUSTFLAGS: -D warnings -C target-feature=+avx2,+avx512f,+avx512dq
        run: cargo nextest run --release --target x86_64-unknown-linux-gnu -p jolt-field --no-default-features --features solinas,asm --test solinas_packed_differential
      - name: Compare scalar assembly with portable arithmetic under emulation
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: /opt/intel-sde/sde64 -icx --
          RUSTFLAGS: -D warnings -C target-feature=+avx2,+avx512f,+avx512dq
        run: cargo nextest run --release --target x86_64-unknown-linux-gnu -p jolt-field --no-default-features --features solinas,asm --lib -E 'test(fp128_asm_matches_portable)'

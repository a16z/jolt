# Approves or withdraws approval of pull requests into main, and publishes the gate's labels and
# status, with the workflow's own GITHUB_TOKEN; policy and admin setup: .github/ai-merge-gate.md.
# Both triggers run this file and the checked-out scripts and skills from the default branch. Pull
# request bytes are read through the API as data, the commits' archives included, and never
# checked out, written or executed.
name: AI merge gate

on:
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [AI merge gate events]
    types: [completed]

permissions: {}

jobs:
  resolve:
    # The resolver admits the Pika bot and ignores other bots.
    if: >-
      github.event_name == 'workflow_run' ||
      github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/ci/ai_merge_gate.py resolve

  evaluate:
    needs: resolve
    if: needs.resolve.outputs.pr != ''
    runs-on: ubuntu-latest
    # The classifier is bounded at 40 minutes by the script.
    timeout-minutes: 50
    # One evaluation per PR at a time, and the newest pending one replaces older pending ones,
    # so the last result published reflects the last event. The classifier's attempt ledger
    # and the gate's approval depend on this: two evaluations of one pull request never pay or
    # approve at once.
    concurrency:
      group: ai-merge-gate-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    # Actions read verifies a cached classifier result's run; Pull requests write covers labels,
    # the classifier comment and the gate's review.
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            .github
            .claude/skills/verifier-classifier
            specs
      - env:
          GH_TOKEN: ${{ github.token }}
          AI_MERGE_GATE_MAINTAINERS: ${{ vars.AI_MERGE_GATE_MAINTAINERS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
        run: python3 scripts/ci/ai_merge_gate.py evaluate "$PR_NUMBER"

# Approves or withdraws approval of pull requests into main, and publishes the gate's labels and
# status, with the workflow's own GITHUB_TOKEN; policy and admin setup: .github/ai-merge-gate.md.
# All triggers run this file and the checked-out scripts and skills from the default branch. Pull
# request bytes are exported as data for a separate read-only classifier job. Jobs holding a write
# token never execute pull-request bytes.
name: AI merge gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [AI merge gate events]
    types: [completed]

permissions: {}

jobs:
  resolve:
    # The resolver admits the Pika bot and ignores other bots.
    if: >-
      github.event_name == 'workflow_run' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/ai_merge_gate.py resolve

  refresh:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci/ai_merge_gate.py refresh "$PR_NUMBER"

  conflicts:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ai-merge-gate-conflicts
      cancel-in-progress: true
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/ci/ai_merge_gate.py refresh-all

  evaluate:
    needs: resolve
    if: needs.resolve.outputs.pr != ''
    concurrency:
      group: ai-merge-gate-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ai-merge-gate-evaluate.yml
    with:
      pr: ${{ needs.resolve.outputs.pr }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

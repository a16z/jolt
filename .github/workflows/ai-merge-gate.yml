# Publishes the required `ai-merge-gate` check through the gate's GitHub App; policy and
# admin setup: .github/ai-merge-gate.md. Both triggers run this file and the checked-out
# scripts and skills from the default branch. Pull request bytes are read through the API as
# data and never checked out or executed. Secrets live in the `ai-merge-gate` environment,
# whose deployment branch policy admits only the default branch.
name: AI merge gate

on:
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [AI merge gate events]
    types: [completed]

permissions: {}

jobs:
  resolve:
    # The App's own comments never carry sign-offs; skipping them also stops its sticky
    # comment edits from re-triggering the gate.
    if: >-
      github.event_name == 'workflow_run' ||
      (github.event.issue.pull_request && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/ci/ai_merge_gate.py resolve

  evaluate:
    needs: resolve
    if: needs.resolve.outputs.pr != ''
    runs-on: ubuntu-latest
    # Covers a classifier and a CI review in one run, each bounded at 40 minutes by the script.
    timeout-minutes: 90
    environment:
      name: ai-merge-gate
      deployment: false
    # One evaluation per PR at a time, and the newest pending one replaces older pending ones,
    # so the last result published reflects the last event.
    concurrency:
      group: ai-merge-gate-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            .claude/skills
            specs
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AI_MERGE_GATE_CLIENT_ID }}
          private-key: ${{ secrets.AI_MERGE_GATE_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-pull-requests: write
          permission-members: read
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AI_MERGE_GATE_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          AI_MERGE_GATE_CORE_TEAM: ${{ vars.AI_MERGE_GATE_CORE_TEAM }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
        run: python3 scripts/ci/ai_merge_gate.py evaluate "$PR_NUMBER"

# Approves or withdraws approval of pull requests into main, and publishes the gate's labels and
# status, with the workflow's own GITHUB_TOKEN; policy and admin setup: .github/ai-merge-gate.md.
# Both triggers run this file and the checked-out scripts and skills from the default branch. Pull
# request bytes are exported as data for a separate read-only classifier job. Only the trusted
# preparation and publishing jobs hold a write token; none executes pull-request bytes.
name: AI merge gate

on:
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [AI merge gate events]
    types: [completed]

permissions: {}

jobs:
  resolve:
    # The resolver admits the Pika bot and ignores other bots.
    if: >-
      github.event_name == 'workflow_run' ||
      github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/ai_merge_gate.py resolve

  evaluate:
    needs: resolve
    if: needs.resolve.outputs.pr != ''
    concurrency:
      group: ai-merge-gate-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ai-merge-gate-evaluate.yml
    with:
      pr: ${{ needs.resolve.outputs.pr }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

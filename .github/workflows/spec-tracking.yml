name: Spec Workflow

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  spec-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Fetch PR head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch origin "+refs/pull/${PR_NUMBER}/head"

      - name: Detect spec and code changes
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          CHANGED=$(git diff --name-only "$BASE"..."$HEAD")

          HAS_SPEC=false
          HAS_CODE=false

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              specs/*.md)
                # Exclude README and TEMPLATE
                basename=$(basename "$file")
                if [ "$basename" != "README.md" ] && [ "$basename" != "TEMPLATE.md" ]; then
                  HAS_SPEC=true
                fi
                ;;
              *)
                HAS_CODE=true
                ;;
            esac
          done <<< "$CHANGED"

          echo "has_spec=$HAS_SPEC" >> "$GITHUB_OUTPUT"
          echo "has_code=$HAS_CODE" >> "$GITHUB_OUTPUT"

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "spec" --description "PR contains a spec" --color "0E8A16" 2>/dev/null || true
          gh label create "no-spec" --description "PR has no spec file" --color "E4E669" 2>/dev/null || true
          gh label create "implementation" --description "PR contains implementation of a spec" --color "1D76DB" 2>/dev/null || true
          gh label create "claude-spec-review-request" --description "Triggers Claude spec analysis" --color "D4C5F9" 2>/dev/null || true
          gh label create "claude-spec-approved" --description "Claude analysis found no ambiguities" --color "5319E7" 2>/dev/null || true

      - name: Apply labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HAS_SPEC: ${{ steps.detect.outputs.has_spec }}
          HAS_CODE: ${{ steps.detect.outputs.has_code }}
        run: |
          if [ "$HAS_SPEC" = "true" ]; then
            gh pr edit "$PR_NUMBER" --add-label "spec" --remove-label "no-spec" 2>/dev/null || true
          else
            gh pr edit "$PR_NUMBER" --add-label "no-spec" --remove-label "spec" 2>/dev/null || true
          fi

          if [ "$HAS_SPEC" = "true" ] && [ "$HAS_CODE" = "true" ]; then
            gh pr edit "$PR_NUMBER" --add-label "implementation"
          fi

  large-pr-warning:
    runs-on: ubuntu-latest
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Fetch PR head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch origin "+refs/pull/${PR_NUMBER}/head"

      - name: Check actual-code size
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          THRESHOLD: "500"
        run: |
          set -euo pipefail

          # The spec nudge counts only ACTUAL CODE lines (added + removed):
          # the diff classifier's "code" category — Rust/jolt code. Tests,
          # docs, fixtures, and helper scripts are excluded, so e.g. a large
          # test-only or CI-only PR no longer trips the spec requirement.
          # The classifier diffs merge-base(BASE, HEAD) against HEAD, same
          # three-dot semantics as before. It runs from the BASE checkout
          # (pull_request_target), never code from the PR head.
          CODE_LINES=""
          if JSON=$(python3 scripts/ci/diff_classifier.py --base "$BASE" --head "$HEAD" --format json); then
            # `|| true`-shaped fallback: a jq failure must reach the numstat
            # fallback below, not fail the step under `set -e`.
            CODE_LINES=$(printf '%s\n' "$JSON" | jq '.code.added + .code.removed') || CODE_LINES=""
          fi
          if ! [ "$CODE_LINES" -ge 0 ] 2>/dev/null; then
            # Classifier unavailable: fall back to counting all non-spec
            # lines (the previous behavior) so the nudge never silently
            # disappears.
            CODE_LINES=$(git diff --numstat "$BASE"..."$HEAD" -- . ':!specs/' | \
              awk '$1 != "-" && $2 != "-" { added += $1; removed += $2 } END { print (added + removed) ? added + removed : 0 }')
            echo "diff classifier failed; falling back to total changed lines: ${CODE_LINES}" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Check if any spec file exists in the diff. Pathspec excludes
          # README/TEMPLATE directly so the pipeline has no `grep -v`
          # (which exits 1 on empty input and would trip `pipefail`).
          HAS_SPEC=$(git diff --name-only "$BASE"..."$HEAD" -- 'specs/*.md' ':!specs/README.md' ':!specs/TEMPLATE.md' | head -1)

          if [ "$CODE_LINES" -le "$THRESHOLD" ]; then
            echo "spec not required: ${CODE_LINES} actual-code lines <= ${THRESHOLD}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -n "$HAS_SPEC" ]; then
            echo "spec present: ${CODE_LINES} actual-code lines > ${THRESHOLD} and the PR includes a spec" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "spec suggested: ${CODE_LINES} actual-code lines > ${THRESHOLD} and no spec file" >> "$GITHUB_STEP_SUMMARY"
          # Keep "more than 500 changed lines" in the body: the dedupe grep
          # below matches it in both the old and new comment wording.
          EXISTING=$(gh pr view "$PR_NUMBER" --json comments --jq '.comments[].body' | grep -c "more than 500 changed lines" || true)
          if [ "$EXISTING" -eq 0 ]; then
            cat > "$RUNNER_TEMP/spec-warning.md" <<EOF
          > [!WARNING]
          > This PR has **more than 500 changed lines of actual code** (${CODE_LINES} added+removed; tests, docs, fixtures, and helper scripts are excluded) and does not include a spec.
          >
          > Large features and architectural changes benefit from a spec-driven workflow.
          > See [CONTRIBUTING.md](https://github.com/a16z/jolt/blob/main/CONTRIBUTING.md) for details on how to create a spec.
          >
          > If this PR is a bug fix, refactor, or doesn't warrant a spec, feel free to ignore this message.
          EOF
            gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/spec-warning.md"
          fi

[test-groups]
# Dory tests mutate global state and use #[serial] from serial_test, but that
# only serializes within a single process. Nextest runs each test in its own
# process, so we use a test group to enforce serial execution instead.
dory = { max-threads = 1 }
# ZK verifier fixture tests generate shared temp artifacts and use large stacks;
# keep them serial to avoid host memory and fixture contention.
zk-core-fixtures = { max-threads = 1 }
# Each byte-diff arm retains both modular and legacy proof artifacts. Keep
# those four processes mutually exclusive without serializing the neighboring
# Akita end-to-end tests.

[[profile.default.overrides]]
filter = 'test(dory)'
test-group = 'dory'

[[profile.default.overrides]]
filter = 'package(jolt-verifier) and test(zk)'
test-group = 'zk-core-fixtures'

# A hung Metal kernel blocks wait_until_completed forever and starves WindowServer;
# watchdogd panics the machine 120 s later. Kill Metal test processes well before
# that so the driver can reset the GPU. Second layer behind the in-process canary
# in jolt-kernels metal::solinas::hang_watchdog.
[[profile.default.overrides]]
filter = 'test(metal)'
slow-timeout = { period = "30s", terminate-after = 2, grace-period = "5s" }

[package]
name = "tracer"
version = "0.2.0"
authors = [
  # author of the original riscv-rust codebase
  "Takahiro <hogehoge@gachapin.jp>",
  # authors of the modifications for Jolt
  "Michael Zhu <mzhu@a16z.com>",
  "Sam Ragsdale <sragsdale@a16z.com>",
  "Noah Citron <ncitron@a16z.com>",
  "Andrew Tretyakov <atretyakov@a16z.com>",
  "Markos Georghiades <mgeorghiades@a16z.com>",
]
description = "RISC-V emulator for Jolt"
license = "MIT"
homepage = "https://github.com/a16z/jolt/README.md"
repository = "https://github.com/a16z/jolt"
edition = "2021"

[[bin]]
name = "jolt-emu"
path = "src/main.rs"

[features]
default = ["std"]
std = [
  "jolt-platform/std",
  "common/std",
  "fnv/std",
  "object/std",
  "tracing/std",
  "postcard/use-std",
  "serde_json/std",
]
test-utils = ["dep:rand"]
field-inline = [
  "jolt-program/field-inline",
  "jolt-riscv/field-inline",
  "dep:jolt-field",
]

[dependencies]
thiserror.workspace = true
jolt-program = { workspace = true, features = ["image", "serialization"] }
jolt-riscv = { workspace = true, features = ["serialization"] }
jolt-field = { workspace = true, optional = true }
jolt-platform.workspace = true
fnv.workspace = true
object.workspace = true
tracing = { workspace = true, features = [
  "attributes",
], default-features = false }
ark-serialize.workspace = true
derive_more.workspace = true
serde.workspace = true
serde_json.workspace = true
strum_macros.workspace = true
strum.workspace = true
rand = { workspace = true, optional = true }
inventory.workspace = true
paste.workspace = true
itertools.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
common = { workspace = true, default-features = false }
postcard.workspace = true
addr2line.workspace = true

[package.metadata.cargo-machete]
ignored = ["strum"]

[dev-dependencies]
rand.workspace = true
blake3.workspace = true
# Linked by the trace_* example harnesses for inline inventory registration.
jolt-inlines-keccak256 = { workspace = true, features = ["host"] }
jolt-inlines-sha2 = { workspace = true, features = ["host"] }

# Tracer regression harnesses (developer-invoked; not run by cargo test/bench).
# trace_golden checks fixtures in tests/fixtures/golden_traces.json; the other
# two gates and the throughput bench are documented in each file's header.
[[example]]
name = "trace_bench"
required-features = ["std"]

[[example]]
name = "trace_golden"
required-features = ["std"]

[[example]]
name = "trace_lockstep"
required-features = ["std"]

[[example]]
name = "trace_chunk_replay"
required-features = ["std"]

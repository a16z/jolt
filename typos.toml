[files]
# golden_bytes.rs is hex fixture data (byte-encoding pins); hex substrings
# trigger false positives ("ede", "ba").
extend-exclude = ["patches/*.patch", "crates/jolt-field/tests/golden_bytes.rs"]

[default.extend-words]
"groth" = "groth"
"fle" = "fle"
"sie" = "sie"
"stip" = "stip"
"thr" = "thr"
"thre" = "thre"
"numer" = "numer"
"Hax" = "Hax"
"Toom" = "Toom"
# "iy" is an index variable (paired with "ix") in jolt-poly's lagrange code.
"iy" = "iy"
# sail_riscv_sim config schema field names (tests/arch-tests/jolt/sail.json):
# "nto" is Zawrs "no timeout", "useed"/"sseed" are Zkr entropy CSR fields.
"nto" = "nto"
"useed" = "useed"
"sseed" = "sseed"
"mis" = "mis"
# "tru"/"unt" are the trusted/untrusted advice commitment-object shorthands
# (A_tru, A_unt) in the packed (Akita) prove path docs.
"tru" = "tru"
"unt" = "unt"

[type.ocaml.extend-words]
# HOL Light tactic identifiers.
"ASSUM" = "ASSUM"
"THM" = "THM"

[type.sh.extend-words]
# HOL Light theorem type emitted and checked by the proof runner.
"thm" = "thm"

[type.py.extend-words]
# Proof checkers contain this x86 immediate and the HOL Light theorem type.
"ba" = "ba"
"thm" = "thm"

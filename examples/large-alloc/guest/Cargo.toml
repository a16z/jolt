[package]
name = "large-alloc-guest"
version = "0.1.0"
edition = "2021"

[features]
guest = []
field-inline = ["jolt/field-inline"]
# `shared_heap_roundtrip`: Rust allocations on the size-class arena, with a
# spawned thread so musl maps a pthread stack.
size-class-alloc = ["jolt/guest-size-class-alloc", "jolt/thread"]

[dependencies]
jolt = { package = "jolt-sdk", path = "../../../jolt-sdk", features = [
  "guest-std",
] }
libc = "0.2"

[lib]
test = false
doctest = false
bench = false

[[bin]]
name = "large-alloc-guest"
path = "src/main.rs"
test = false
bench = false

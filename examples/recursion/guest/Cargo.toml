[package]
name = "recursion-guest"
version = "0.1.0"
edition = "2021"

[features]
terminal-contraction = [
  "jolt-akita?/terminal-contraction",
  "jolt-field/terminal-contraction",
]
immutable-recipes = [
  "akita",
  "field-inline-fp128",
  "jolt_sdk/immutable-recipes",
]
ntt-inline = ["akita", "jolt-akita/ntt-inline"]
guest = []
word-memory = ["jolt_sdk/word-memory"]
kernel-tests = ["field-inline"]
field-inline = ["jolt_sdk/field-inline"]
field-inline-bn254 = ["field-inline", "jolt-field/field-inline-guest-bn254"]
field-inline-fp128 = ["field-inline", "jolt-field/field-inline-guest-fp128"]
akita = [
  "jolt_sdk/akita",
  "dep:jolt-akita",
  "dep:jolt-crypto",
  "dep:jolt-transcript",
]
fast-alloc = ["jolt_sdk/guest-size-class-alloc"]
hash-inlines = [
  "jolt_sdk/blake2-inline",
  "jolt-transcript?/blake2-inline",
  "jolt-akita?/blake2-inline",
]

word-decode = ["akita", "jolt-akita/word-decode"]
ont-static-base = ["akita", "jolt-akita/ont-static-base"]
tensor-no-carry = ["akita", "jolt-akita/tensor-no-carry"]
rowptr-registers = ["jolt-field/field-inline-rowptr"]
weighted-dot-horner = ["jolt-field/field-inline-horner"]
weighted-dot-horner-triplet = [
  "weighted-dot-horner",
  "jolt-field/field-inline-horner-triplet",
]
tensor-eq-runs = ["akita", "jolt-akita/tensor-eq-runs"]
setup-sop-structured = ["akita", "jolt-akita/setup-sop-structured"]
bytecode-fold = ["akita", "jolt-akita/bytecode-fold"]
fill-ingress = ["akita", "jolt-akita/fill-ingress"]
compressed-poly-horner = ["dep:jolt-poly", "jolt-poly/compressed-poly-horner"]

[package.metadata.cargo-machete]
# jolt-poly and jolt-transcript forward features to the verifier dependencies.
# Generated embedded_bytecode.rs imports jolt-riscv when the host embeds a guest.
ignored = ["jolt-poly", "jolt-riscv", "jolt-transcript"]

[dependencies]
jolt-poly = { path = "../../../crates/jolt-poly", default-features = false, optional = true }
jolt-inlines-blake2.workspace = true
jolt-riscv = { path = "../../../crates/jolt-riscv" }
jolt_sdk = { package = "jolt-sdk", path = "../../../jolt-sdk", features = [
  "guest-verifier",
  "transcript-blake2b",
  "thread",
  "random",
] }
bincode.workspace = true
serde.workspace = true
jolt-field = { path = "../../../crates/jolt-field" }
jolt-akita = { path = "../../../crates/jolt-akita", optional = true, default-features = false }
jolt-crypto = { path = "../../../crates/jolt-crypto", optional = true, default-features = false }
jolt-transcript = { path = "../../../crates/jolt-transcript", default-features = false, features = [
  "transcript-blake2b",
], optional = true }

[lib]
test = false
doctest = false
bench = false

[[bin]]
name = "recursion-guest"
path = "src/main.rs"
test = false
bench = false

[package]
name = "recursion-guest"
version = "0.1.0"
edition = "2021"

[features]
ntt-inline = ["akita", "jolt-akita/ntt-inline"]
guest = []
kernel-tests = ["field-inline"]
field-inline = ["jolt_sdk/field-inline"]
# The field the field-inline unit computes in: BN254 `Fr` under Dory, the
# Fp128 protocol prime under Akita. The host selects the one its tracer uses.
field-inline-bn254 = ["field-inline", "jolt-field/field-inline-guest-bn254"]
field-inline-fp128 = ["field-inline", "jolt-field/field-inline-guest-fp128"]
akita = ["jolt_sdk/akita", "dep:jolt-akita", "dep:jolt-crypto"]
fast-alloc = ["jolt_sdk/guest-size-class-alloc"]
hash-inlines = ["jolt_sdk/blake2-inline"]

[package.metadata.cargo-machete]
# Generated embedded_bytecode.rs imports jolt-riscv when the host prepares an
# embedded guest.
ignored = ["jolt-riscv"]

[dependencies]
jolt-inlines-blake2.workspace = true
jolt-riscv = { path = "../../../crates/jolt-riscv" }
jolt_sdk = { package = "jolt-sdk", path = "../../../jolt-sdk", features = [
  "guest-verifier",
  "transcript-blake2b",
  "thread",
  "random",
] }
bincode.workspace = true
serde.workspace = true
jolt-field = { path = "../../../crates/jolt-field" }
jolt-akita = { path = "../../../crates/jolt-akita", optional = true, default-features = false }
jolt-crypto = { path = "../../../crates/jolt-crypto", optional = true, default-features = false }

[lib]
test = false
doctest = false
bench = false

[[bin]]
name = "recursion-guest"
path = "src/main.rs"
test = false
bench = false

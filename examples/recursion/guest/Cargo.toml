[package]
name = "recursion-guest"
version = "0.1.0"
edition = "2021"

[features]
terminal-contraction = ["jolt-akita?/terminal-contraction", "jolt-field/terminal-contraction"]
segment-setup = ["jolt-akita?/segment-setup"]
ntt-inline = ["akita", "jolt-akita/ntt-inline"]
guest = []
word-memory = ["jolt_sdk/word-memory"]
field-inline = ["jolt_sdk/field-inline"]
# The field the field-inline unit computes in: BN254 `Fr` under Dory, the
# Fp128 protocol prime under Akita. The host selects the one its tracer uses.
field-inline-bn254 = ["field-inline", "jolt-field/field-inline-guest-bn254"]
field-inline-fp128 = ["field-inline", "jolt-field/field-inline-guest-fp128"]
akita = [
  "jolt_sdk/akita",
  "dep:jolt-akita",
  "dep:jolt-crypto",
  "dep:jolt-transcript",
]
fast-alloc = ["jolt_sdk/guest-size-class-alloc"]
# L2 terminal quotient certificate (see the host feature).
l2-terminal-quotient = ["akita", "jolt-akita/l2-terminal-quotient"]
hash-inlines = [
  "jolt_sdk/blake2-inline",
  "jolt-transcript?/blake2-inline",
  "jolt-akita?/blake2-inline",
  "jolt-akita?/keccak-inline",
]
# L3 recursion experiment: factorized compression-weight evaluation.
l3-compression-weights = ["akita", "jolt-akita/l3-compression-weights"]

word-transcript = ["akita", "jolt-akita/word-transcript"]
word-decode = ["akita", "jolt-akita/word-decode"]
ont-static-base = ["akita", "jolt-akita/ont-static-base"]
tensor-no-carry = ["akita", "jolt-akita/tensor-no-carry"]
# Row pointers (default off): weighted-dot row pointers held in registers.
rowptr-registers = ["jolt-field/field-inline-rowptr"]
tensor-eq-runs = ["akita", "jolt-akita/tensor-eq-runs"]
setup-sop-structured = ["akita", "jolt-akita/setup-sop-structured"]
[package.metadata.cargo-machete]
# The jolt-field edge selects the guest's field-inline arithmetic; generated
# embedded_bytecode.rs imports jolt-riscv types when the host prepares an
# embedded guest.
ignored = ["jolt-field", "jolt-riscv"]

[dependencies]
jolt-riscv = { path = "../../../crates/jolt-riscv" }
jolt_sdk = { package = "jolt-sdk", path = "../../../jolt-sdk", features = [
  "guest-verifier",
  "thread",
  "random",
] }
bincode.workspace = true
serde.workspace = true
jolt-field = { path = "../../../crates/jolt-field" }
jolt-akita = { path = "../../../crates/jolt-akita", optional = true, default-features = false }
jolt-crypto = { path = "../../../crates/jolt-crypto", optional = true, default-features = false }
jolt-transcript = { path = "../../../crates/jolt-transcript", default-features = false, features = [
  "transcript-blake2b",
], optional = true }

[lib]
test = false
doctest = false
bench = false

[[bin]]
name = "recursion-guest"
path = "src/main.rs"
test = false
bench = false

[package]
name = "recursion-guest"
version = "0.1.0"
edition = "2021"

[features]
ntt-inline = ["akita", "jolt-akita/ntt-inline"]
guest = []
field-inline = ["jolt_sdk/field-inline", "jolt-field/field-inline-guest"]
akita = ["jolt_sdk/akita", "dep:jolt-akita", "dep:jolt-crypto", "dep:jolt-transcript"]
trusted-preprocessing = ["jolt-dory/unchecked-verifier-setup"]
fast-alloc = ["jolt_sdk/guest-size-class-alloc", "jolt_sdk/guest-fast-mem"]
blake2-inline = ["jolt_sdk/blake2-inline", "jolt-transcript?/blake2-inline", "jolt-akita?/blake2-inline"]

[dependencies]
jolt-riscv = { path = "../../../crates/jolt-riscv" }
jolt_sdk = { package = "jolt-sdk", path = "../../../jolt-sdk", features = [
  "guest-verifier",
  "thread",
  "random",
] }
bincode.workspace = true
serde.workspace = true
jolt-field = { path = "../../../crates/jolt-field" }
jolt-akita = { path = "../../../crates/jolt-akita", optional = true, default-features = false }
jolt-dory = { path = "../../../crates/jolt-dory" }
jolt-crypto = { path = "../../../crates/jolt-crypto", optional = true, default-features = false }
jolt-transcript = { path = "../../../crates/jolt-transcript", optional = true }

[lib]
test = false
doctest = false
bench = false

[[bin]]
name = "recursion-guest"
path = "src/main.rs"
test = false
bench = false

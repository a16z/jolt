[package]
name = "recursion"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "recursion"
path = "src/main.rs"

[features]
ntt-inline = ["akita", "dep:jolt-inlines-ntt"]
# Non-default, like eqpoly-field: default workspace builds must not unify
# field-inline into the verifier stack. The recursion flow needs it.
field-inline = ["jolt-sdk/field-inline", "dep:jolt-field", "jolt-field/field-inline-guest"]
akita = ["jolt-sdk/akita", "dep:jolt-akita", "dep:jolt-program", "dep:jolt-witness", "dep:tracer"]

[package.metadata.cargo-machete]
# Enables field-inline arithmetic in the guest field implementation.
ignored = ["jolt-field"]

[dependencies]
jolt-akita = { path = "../../crates/jolt-akita", default-features = false, optional = true }
jolt-program = { path = "../../crates/jolt-program", optional = true }
jolt-witness = { path = "../../crates/jolt-witness", optional = true }
tracer = { path = "../../tracer", optional = true }
jolt-riscv = { path = "../../crates/jolt-riscv" }
jolt-inlines-ntt = { workspace = true, features = ["host"], optional = true }
# Registers the Blake2b inline with the tracer for the guest transcripts.
jolt-inlines-blake2 = { workspace = true, features = ["host"] }
jolt-sdk = { workspace = true, features = ["host"] }
jolt-field = { path = "../../crates/jolt-field", optional = true }
tracing-subscriber.workspace = true
tracing.workspace = true
postcard.workspace = true
clap.workspace = true
bincode.workspace = true
serde.workspace = true

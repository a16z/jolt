[package]
name = "recursion"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "recursion"
path = "src/main.rs"

[features]
ntt-inline = ["akita", "dep:jolt-inlines-ntt"]
# Guest arithmetic and FR decoding do not select the inner proof
# verifier's FR protocol. That axis belongs to outer-prover.
field-inline = ["jolt-sdk/field-inline", "dep:jolt-field", "jolt-field/field-inline-guest"]
akita = ["jolt-sdk/akita"]
# The outer proof verifies FR instructions; the inner proof need not use FR.
outer-prover = ["akita", "field-inline", "dep:jolt-prover", "jolt-prover/akita", "jolt-prover/field-inline", "dep:jolt-program", "dep:jolt-witness", "jolt-witness/field-inline", "dep:tracer", "tracer/field-inline", "tracer/fp128-field-inline", "dep:jolt-akita"]

[dependencies]
common.workspace = true
jolt-riscv = { path = "../../crates/jolt-riscv" }
jolt-inlines-ntt = { workspace = true, features = ["host"], optional = true }
jolt-openings = { path = "../../crates/jolt-openings" }
# Registers the Blake2b inline with the tracer for the guest transcripts.
jolt-inlines-blake2 = { workspace = true, features = ["host"] }
jolt-sdk = { workspace = true, features = ["host"] }
jolt-field = { path = "../../crates/jolt-field", optional = true }
tracing-subscriber.workspace = true
tracing.workspace = true
postcard.workspace = true
clap.workspace = true
bincode.workspace = true
serde.workspace = true
jolt-prover = { path = "../../crates/jolt-prover", optional = true }
jolt-program = { workspace = true, features = ["image"], optional = true }
jolt-witness = { workspace = true, optional = true }
tracer = { workspace = true, optional = true }
jolt-akita = { path = "../../crates/jolt-akita", optional = true }
serde_json.workspace = true

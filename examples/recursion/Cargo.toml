[package]
name = "recursion"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "recursion"
path = "src/main.rs"

[features]
word-memory = []
ntt-inline = ["akita", "dep:jolt-inlines-ntt"]
# Non-default: default workspace builds must not unify field-inline into the
# verifier stack. The recursion flow needs it.
field-inline = ["jolt-sdk/field-inline"]
akita = [
  "jolt-sdk/akita",
  "dep:jolt-akita",
  "dep:jolt-program",
  "dep:jolt-witness",
  "dep:tracer",
]
# L3 compression-weight factoring and the L2 terminal quotient certificate,
# both default on and both effective only with `akita`. L3: the verifier guest
# (and the host's Akita) evaluate the compression relation weights by factor;
# same field values. L2: the inner Akita proofs carry the terminal A-row
# quotient (protocol identifier v7-l2tq1) and the guest checks it at two
# points instead of the exact product. Word decoding: the guest decodes
# fixed-wire field elements by word with the same canonicality checks. Turn
# all three off with --no-default-features. guest-codegen: the verifier guest
# is built with -Cllvm-args=-inline-threshold=1750, -Cllvm-args=-enable-gvn-hoist,
# -Cllvm-args=-enable-dfa-jump-thread, -Cllvm-args=-enable-ext-tsp-block-placement,
# -Cllvm-args=-enable-tail-merge=false and one codegen unit (host side only;
# RECURSION_GUEST_CODEGEN=off restores the stock guest build).
default = ["l3-compression-weights", "l2-terminal-quotient", "word-decode", "word-memory", "guest-codegen"]
guest-codegen = []
l3-compression-weights = ["jolt-akita?/l3-compression-weights"]
l2-terminal-quotient = ["jolt-akita?/l2-terminal-quotient"]
word-decode = ["jolt-akita?/word-decode"]

# Each remaining arm is selected independently and forwarded to the guest.
word-transcript = ["akita", "jolt-akita/word-transcript"]
ont-static-base = ["akita", "jolt-akita/ont-static-base"]

[dependencies]
jolt-akita = { path = "../../crates/jolt-akita", optional = true }
jolt-program = { path = "../../crates/jolt-program", optional = true }
jolt-witness = { path = "../../crates/jolt-witness", optional = true }
tracer = { path = "../../tracer", optional = true }
jolt-riscv = { path = "../../crates/jolt-riscv" }
jolt-inlines-ntt = { workspace = true, features = ["host"], optional = true }
# Registers the Blake2b inline with the tracer for the guest transcripts.
jolt-inlines-blake2 = { workspace = true, features = ["host"] }
# Registers the Keccak inline the Akita SHAKE samplers use.
jolt-inlines-keccak256 = { workspace = true, features = ["host"] }
jolt-sdk = { workspace = true, features = ["host"] }
tracing-subscriber.workspace = true
tracing.workspace = true
postcard.workspace = true
clap.workspace = true
bincode.workspace = true
serde.workspace = true

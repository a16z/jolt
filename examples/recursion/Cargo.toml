[package]
name = "recursion"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "recursion"
path = "src/main.rs"

[features]
terminal-contraction = ["jolt-akita?/terminal-contraction"]
immutable-recipes = [
  "akita",
  "field-inline",
  "jolt-sdk/immutable-recipes",
  "jolt-sdk/immutable-recipes-record",
  "dep:jolt-claims",
  "jolt-claims/immutable-recipes-record",
  "dep:sha2",
  "dep:hex",
]
immutable-recipes-record = ["immutable-recipes", "dep:serde_json"]
word-memory = []
ntt-inline = ["akita", "dep:jolt-inlines-ntt"]
field-inline = ["jolt-sdk/field-inline"]
akita = [
  "jolt-sdk/akita",
  "dep:jolt-akita",
  "dep:jolt-program",
  "dep:jolt-witness",
  "dep:tracer",
]
default = [
  "word-decode",
  "word-memory",
  "guest-codegen",
  "tensor-no-carry",
  "rowptr-registers",
  "tensor-eq-runs",
  "setup-sop-structured",
  "weighted-dot-horner",
  "terminal-contraction",
  "weighted-dot-horner-triplet",
  "bytecode-fold",
  "fill-ingress",
  "compressed-poly-horner",
]
guest-codegen = []
word-decode = ["jolt-akita?/word-decode"]
tensor-no-carry = ["jolt-akita?/tensor-no-carry"]
tensor-eq-runs = ["jolt-akita?/tensor-eq-runs"]
ont-static-base = ["akita", "jolt-akita/ont-static-base"]
rowptr-registers = []
setup-sop-structured = ["jolt-akita?/setup-sop-structured"]
weighted-dot-horner = []
weighted-dot-horner-triplet = ["weighted-dot-horner"]
compressed-poly-horner = []
bytecode-fold = ["jolt-akita?/bytecode-fold"]
fill-ingress = ["jolt-akita?/fill-ingress"]

[dependencies]
jolt-claims = { path = "../../crates/jolt-claims", optional = true }
jolt-field.workspace = true
jolt-poly.workspace = true
jolt-sumcheck.workspace = true
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
serde_json = { workspace = true, features = ["std"], optional = true }
jolt-akita = { path = "../../crates/jolt-akita", optional = true }
jolt-program = { path = "../../crates/jolt-program", optional = true }
jolt-witness = { path = "../../crates/jolt-witness", optional = true }
tracer = { path = "../../tracer", optional = true }
jolt-riscv = { path = "../../crates/jolt-riscv" }
jolt-inlines-ntt = { workspace = true, features = ["host"], optional = true }
# Registers the Blake2b inline with the tracer for the guest transcripts.
jolt-inlines-blake2 = { workspace = true, features = ["host"] }
# Registers the Keccak inline the Akita SHAKE samplers use.
jolt-inlines-keccak256 = { workspace = true, features = ["host"] }
jolt-sdk = { workspace = true, features = ["host", "transcript-blake2b"] }
tracing-subscriber.workspace = true
tracing.workspace = true
postcard.workspace = true
clap.workspace = true
bincode.workspace = true
serde.workspace = true

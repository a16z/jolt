[package]
name = "jolt-akita-recursion-guest"
version = "0.1.0"
edition = "2021"
publish = false

[features]
guest = [
  "jolt-akita-recursion/akita",
  "dep:jolt-akita",
  "jolt/guest-std",
  "jolt/stdout",
  "jolt/random",
  "jolt/thread",
]

[dependencies]
jolt = { package = "jolt-sdk", path = "../../../jolt-sdk", default-features = false }
jolt-akita-recursion = { path = ".." }
jolt-akita = { workspace = true, optional = true }

[lib]
test = false
doctest = false

[[bin]]
name = "jolt-akita-recursion-guest"
path = "src/main.rs"
test = false
bench = false

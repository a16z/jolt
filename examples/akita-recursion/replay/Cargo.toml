[package]
name = "jolt-akita-external"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata.cargo-machete]
# Imported by ../guest_build.rs, outside this package's source tree.
ignored = ["jolt-host", "jolt-inlines-blake2", "jolt-inlines-keccak256"]

[features]
akita = [
  "jolt-akita-recursion/akita",
  "dep:jolt-akita",
  "dep:jolt-verifier",
  "dep:akita-types",
]
recursion-host = [
  "akita",
  "dep:common",
  "dep:jolt-host",
  "dep:jolt-inlines-blake2",
  "dep:jolt-inlines-keccak256",
  "dep:tracer",
  "dep:tracing-subscriber",
  "dep:tracing",
]
[dependencies]
common = { workspace = true, optional = true }
serde.workspace = true
bincode.workspace = true
postcard = { workspace = true, features = ["use-std"] }
jolt-akita-recursion = { path = ".." }
jolt-akita = { workspace = true, optional = true }
jolt-verifier = { workspace = true, features = ["akita"], optional = true }

akita-types = { workspace = true, optional = true }
anyhow.workspace = true
serde_json.workspace = true
jolt-field.workspace = true
jolt-host = { workspace = true, optional = true }
jolt-inlines-blake2 = { workspace = true, optional = true, features = ["host"] }
jolt-inlines-keccak256 = { workspace = true, optional = true, features = [
  "host",
] }
tracer = { workspace = true, features = ["std"], optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
[[bin]]
name = "outer-verifier-audit"
path = "src/bin/outer-verifier-audit.rs"
required-features = ["akita"]
[[bin]]
name = "outer-verifier-trace"
path = "src/bin/outer-verifier-trace.rs"
required-features = ["recursion-host"]

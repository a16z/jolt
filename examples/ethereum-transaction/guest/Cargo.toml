[package]
name = "ethereum-transaction-guest"
version = "0.1.0"
edition = "2021"

[features]
guest = []
field-inline = ["jolt/field-inline"]

[dependencies]
jolt = { package = "jolt-sdk", path = "../../../jolt-sdk" }
jolt-inlines-keccak256.workspace = true
jolt-inlines-secp256k1.workspace = true
alloy-consensus = { version = "2", default-features = false }
alloy-eips = { version = "2", default-features = false }
alloy-primitives = { version = "1", default-features = false }
alloy-rlp = { version = "0.3", default-features = false, features = ["derive"] }
alloy-trie = { version = "0.9", default-features = false }
revm = { version = "43", default-features = false }
serde = { workspace = true }
thiserror = { version = "2", default-features = false }

[target.'cfg(target_arch = "riscv64")'.dependencies]
alloy-primitives = { version = "1", default-features = false, features = [
  "native-keccak",
] }

[dev-dependencies]
jolt = { package = "jolt-sdk", path = "../../../jolt-sdk", features = ["host"] }
jolt-inlines-secp256k1 = { workspace = true, features = ["host"] }

[lib]
doctest = false
bench = false

[[bin]]
name = "ethereum-transaction-guest"
path = "src/main.rs"
test = false
bench = false

[package]
name = "jolt-utils"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Dependency-light utilities shared across the Jolt workspace"
repository = "https://github.com/a16z/jolt"
keywords = ["SNARK", "zkvm"]
categories = ["cryptography"]

[lints]
workspace = true

[features]
default = []
parallel = ["dep:rayon"]

[dependencies]
num-traits = { workspace = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
jolt-field = { workspace = true }

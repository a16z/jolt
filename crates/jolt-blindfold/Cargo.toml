[package]
name = "jolt-blindfold"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Generic BlindFold verifier infrastructure for the Jolt zkVM"

[lints]
workspace = true

[dependencies]
jolt-claims.workspace = true
jolt-crypto.workspace = true
jolt-field.workspace = true
jolt-poly.workspace = true
jolt-r1cs.workspace = true
jolt-sumcheck = { workspace = true, features = ["committed", "r1cs"] }
# The prover grinds its public proof-of-work nonces on a copy of the sponge.
jolt-transcript = { workspace = true, features = ["prover-grinding"] }
jolt-utils.workspace = true
rand_core.workspace = true
rayon.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true

[dev-dependencies]
jolt-field = { workspace = true, features = ["bn254", "solinas"] }
jolt-transcript = { workspace = true, features = [
  "bn254",
  "solinas",
  "transcript-blake2b",
  "test-utils",
] }
rand_chacha.workspace = true
rand_core.workspace = true

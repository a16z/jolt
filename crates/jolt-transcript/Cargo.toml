[package]
name = "jolt-transcript"
version = "0.1.0"
edition = "2021"
description = "Fiat-Shamir transcript implementations for Jolt"
repository = "https://github.com/a16z/jolt"
license = "MIT OR Apache-2.0"
keywords = ["SNARK", "cryptography", "proofs", "fiat-shamir"]
categories = ["cryptography", "no-std"]

[lints]
workspace = true

[features]
default = ["transcript-blake2b", "transcript-keccak", "transcript-poseidon"]
spongefish = ["dep:rand", "dep:spongefish", "spongefish/sha3"]
digest = ["dep:digest"]
bn254 = [
  "dep:ark-bn254",
  "dep:ark-ff",
  "jolt-field/bn254",
  "spongefish?/ark-ff",
]
transcript-blake2b = ["spongefish", "digest", "spongefish/blake2", "dep:blake2"]
transcript-keccak = ["spongefish", "spongefish/keccak"]
transcript-poseidon = ["spongefish", "bn254", "dep:light-poseidon"]

[dependencies]
ark-bn254 = { workspace = true, optional = true }
ark-ff = { workspace = true, optional = true }
light-poseidon = { workspace = true, optional = true }
spongefish = { workspace = true, optional = true }
blake2 = { workspace = true, optional = true }
digest = { workspace = true, optional = true }
jolt-field = { path = "../jolt-field", default-features = false }
rand = { workspace = true, features = ["std_rng"], optional = true }

[dev-dependencies]
num-traits = { workspace = true }

# criterion pulls rayon by default, which refuses to compile for WASI; the
# transcript tests run on wasm32-wasip1 in CI and only the benches need it.
[target.'cfg(not(target_os = "wasi"))'.dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "transcript_ops"
harness = false
required-features = [
  "transcript-blake2b",
  "transcript-keccak",
  "transcript-poseidon",
]

[[test]]
name = "blake2b_tests"
required-features = ["bn254", "transcript-blake2b"]

[[test]]
name = "keccak_tests"
required-features = ["bn254", "transcript-keccak"]

[[test]]
name = "poseidon_tests"
required-features = ["transcript-poseidon"]

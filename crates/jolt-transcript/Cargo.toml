[package]
name = "jolt-transcript"
version = "0.1.0"
edition = "2021"
description = "Fiat-Shamir transcript implementations for Jolt"
repository = "https://github.com/a16z/jolt"
license = "MIT OR Apache-2.0"
keywords = ["SNARK", "cryptography", "proofs", "fiat-shamir"]
categories = ["cryptography", "no-std"]

[lints]
workspace = true

[features]
default = ["transcript-blake2b", "transcript-keccak", "transcript-poseidon"]
# Records every transcript operation with its site and argument-string range.
logging = []
bn254 = ["dep:ark-bn254", "dep:ark-ff", "jolt-field/bn254"]
transcript-blake2b = ["spongefish/blake2"]
transcript-keccak = ["spongefish/keccak"]
transcript-poseidon = ["bn254", "dep:light-poseidon"]

[dependencies]
ark-bn254 = { workspace = true, optional = true }
ark-ff = { workspace = true, optional = true }
light-poseidon = { workspace = true, optional = true }
# spongefish 0.7 references its sha3 `StdHash` even when another sponge is
# selected, so the feature is required to build at all.
spongefish = { workspace = true, features = ["sha3"] }
rand_core = { workspace = true }
thiserror = { workspace = true }
jolt-field = { path = "../jolt-field", default-features = false }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "transcript_ops"
harness = false
required-features = [
  "transcript-blake2b",
  "transcript-keccak",
  "transcript-poseidon",
]

[[test]]
name = "known_answers"
required-features = [
  "transcript-blake2b",
  "transcript-keccak",
  "transcript-poseidon",
]

[[test]]
name = "narg"
required-features = [
  "transcript-blake2b",
  "transcript-keccak",
  "transcript-poseidon",
]

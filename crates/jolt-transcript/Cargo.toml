[package]
name = "jolt-transcript"
version = "0.1.0"
edition = "2021"
description = "Fiat-Shamir transcript implementations for Jolt"
repository = "https://github.com/a16z/jolt"
license = "MIT OR Apache-2.0"
keywords = ["SNARK", "cryptography", "proofs", "fiat-shamir"]
categories = ["cryptography", "no-std"]

[package.metadata.cargo-machete]
# Enabled only to select getrandom 0.4's `wasm_js` backend on wasm32.
ignored = ["getrandom_v04"]

[lints]
workspace = true

[features]
default = ["transcript-blake2b", "transcript-keccak", "transcript-poseidon"]
spongefish = [
  "dep:spongefish",
  "dep:getrandom_v04",
  "spongefish/getrandom",
  "spongefish/turboshake128",
]
digest = ["dep:digest"]
# The prover's proof-of-work nonce search. It copies the sponge state, which
# spongefish 0.8.0 exposes only under `yolocrypto`; verifier builds leave it off.
prover-grinding = ["spongefish", "spongefish/yolocrypto"]
# Searches proof-of-work nonces on all threads; the nonce found is the same.
parallel = ["prover-grinding", "dep:rayon"]
solinas = ["jolt-field/solinas"]
binary = ["jolt-field/binary"]
bn254 = ["dep:ark-bn254", "dep:ark-ff", "jolt-field/bn254"]
transcript-blake2b = ["spongefish", "digest", "dep:blake2"]
transcript-keccak = ["spongefish", "spongefish/keccak"]
transcript-poseidon = ["spongefish", "bn254", "dep:light-poseidon"]

[dependencies]
ark-bn254 = { workspace = true, optional = true }
ark-ff = { workspace = true, optional = true }
light-poseidon = { workspace = true, optional = true }
spongefish = { workspace = true, optional = true }
blake2 = { workspace = true, optional = true }
digest = { workspace = true, optional = true }
jolt-field = { path = "../jolt-field", default-features = false }
rayon = { workspace = true, optional = true }

# spongefish seeds the prover's private RNG from getrandom 0.4, which needs
# an explicit backend on wasm32-unknown-unknown.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_v04 = { workspace = true, features = ["wasm_js"], optional = true }

[dev-dependencies]
criterion = { workspace = true }
num-bigint = { workspace = true }

[[bench]]
name = "transcript_ops"
harness = false
required-features = [
  "transcript-blake2b",
  "transcript-keccak",
  "transcript-poseidon",
]

[[test]]
name = "blake2b_tests"
required-features = ["bn254", "transcript-blake2b"]

[[test]]
name = "legacy_digest_tests"
required-features = ["bn254", "transcript-blake2b"]

[[test]]
name = "keccak_tests"
required-features = ["bn254", "transcript-keccak"]

[[test]]
name = "pow_tests"
required-features = [
  "transcript-keccak",
  "transcript-blake2b",
  "transcript-poseidon",
  "prover-grinding",
  "bn254",
  "solinas",
  "binary",
]

[[test]]
name = "poseidon_tests"
required-features = ["transcript-poseidon"]

[package]
name = "jolt-transcript"
version = "0.1.0"
edition = "2021"
description = "Fiat-Shamir transcript implementations for Jolt"
repository = "https://github.com/a16z/jolt"
license = "MIT OR Apache-2.0"
keywords = ["SNARK", "cryptography", "proofs", "fiat-shamir"]
categories = ["cryptography", "no-std"]

[package.metadata.cargo-machete]
# Enabled only to select getrandom 0.4's `wasm_js` backend on wasm32.
ignored = ["getrandom_v04"]

[lints]
workspace = true

[features]
# Keccak is the stock sponge; Blake2b and Poseidon are opt-in.
default = ["transcript-keccak"]
# The prover's proof-of-work nonce search. It copies the sponge state, which
# spongefish 0.8.0 exposes only under `yolocrypto`. Dory verifier builds leave
# it off. Akita builds always have it: akita-pcs depends on akita-prover, which
# enables it on this crate through the workspace `[patch]`. `yolocrypto`
# changes visibility only, not the bytes absorbed or squeezed.
prover-grinding = ["spongefish/yolocrypto"]
# OS-seeded prover initialization, and wipe-on-drop of the private SHAKE128
# sponge it seeds. Verifier consumers leave this disabled.
prover-entropy = ["spongefish/getrandom", "dep:getrandom_v04", "shake/zeroize"]
# Private prover coins: `ProverCoins`, `OwnedCoins`, `ProverTranscript::coins`,
# and `ProverCoins::split` for samplers that cannot borrow the transcript.
prover-coins = ["prover-entropy", "dep:rand_core", "dep:zeroize"]
solinas = ["jolt-field/solinas"]
binary = ["jolt-field/binary"]
bn254 = ["dep:ark-bn254", "dep:ark-ff", "jolt-field/bn254"]
transcript-blake2b = ["dep:blake2"]
# Identical BLAKE2b-512 bytes through the existing RISC-V inline.
blake2-inline = [
  "transcript-blake2b",
  "dep:jolt-inlines-blake2",
  "jolt-inlines-blake2/digest",
]
transcript-keccak = ["spongefish/keccak"]
# Identical digest bytes (`DigestHasher`) through the existing RISC-V Keccak-f
# inline. Selects nothing on other targets.
keccak-inline = ["dep:jolt-inlines-keccak256"]
transcript-poseidon = ["bn254", "dep:light-poseidon"]
# Keccak-256 (`0x01` pad) instead of SHA3-256 for every digest a statement or
# key binds (`DigestHasher`). Names itself in `PROTOCOL_ID`.
keccak256-digests = []
# `ScriptedTranscript`: scripted challenges, an event log, no proof of work. Tests only.
test-utils = []

[dependencies]
jolt-inlines-blake2 = { workspace = true, optional = true }
jolt-inlines-keccak256 = { workspace = true, optional = true }
ark-bn254 = { workspace = true, optional = true }
ark-ff = { workspace = true, optional = true }
light-poseidon = { workspace = true, optional = true }
spongefish.workspace = true
shake.workspace = true
rand_core = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
blake2 = { workspace = true, optional = true }
jolt-field = { path = "../jolt-field", default-features = false, features = [
  "spongefish",
] }
sha3.workspace = true

# spongefish seeds the prover's private RNG from getrandom 0.4, which needs
# an explicit backend on wasm32-unknown-unknown.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_v04 = { workspace = true, features = ["wasm_js"], optional = true }

[dev-dependencies]
jolt-transcript = { path = ".", features = ["prover-coins"] }
# A production field for the unit tests (`claim_domain`), without turning on
# this crate's own `solinas` feature.
jolt-field = { path = "../jolt-field", default-features = false, features = [
  "solinas",
] }
criterion = { workspace = true }
num-bigint = { workspace = true }

[[bench]]
name = "transcript_ops"
harness = false
required-features = [
  "transcript-blake2b",
  "transcript-keccak",
  "transcript-poseidon",
]

[[test]]
name = "blake2b_tests"
required-features = ["bn254", "transcript-blake2b"]

[[test]]
name = "keccak_tests"
required-features = ["bn254", "transcript-keccak"]

[[test]]
name = "pow_tests"
required-features = [
  "transcript-keccak",
  "transcript-blake2b",
  "transcript-poseidon",
  "prover-grinding",
  "bn254",
  "solinas",
  "binary",
]

[[test]]
name = "poseidon_tests"
required-features = ["transcript-poseidon"]

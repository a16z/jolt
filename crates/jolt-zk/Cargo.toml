[package]
name = "jolt-zk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Masking front end and BlindFold back end for zero-knowledge Jolt"

[lints]
workspace = true

[features]
# Whiteout's verifier-side building blocks (the constant-term lift, the
# Σ-protocol's segment table and parameters). Off by
# default so the Dory verifier never compiles the lattice ring (I6).
whiteout = ["jolt-algebra/solinas", "jolt-crypto/lattice"]
# Whiteout's prover-only pieces (the zero-constant-term mask sampler, the
# witness alphabet check, the rejection rule). A verifier that enables only
# `whiteout` does not compile them; jolt-akita's `zk-prover` and akita-pcs's
# `zk-prover` enable them for their prover halves, and their verifier-facing
# `zk` does not (specs/whiteout-jolt-integration.md, W6g).
whiteout-prover = ["dep:jolt-dit", "jolt-crypto/sample", "whiteout"]
# Synthetic Σ-protocol statements and the statement-checking response
# prover, for response provers' tests (Akita's W5). Test support only.
whiteout-test-support = [
  "dep:rand_chacha",
  "jolt-transcript/transcript-blake2b",
  "whiteout-prover",
]
# `CommittedPads::uncommitted`, for tests of protocols written over the
# masked channel in other crates (Akita's masked levels).
test-support = []
# Timing harness for examples/sigma_dudect.rs: exposes the Σ-protocol
# attempt's steps on a synthetic instance. Diagnostics only.
whiteout-diagnostics = [
  "dep:rand_chacha",
  "jolt-crypto/sample-diagnostics",
  "jolt-transcript/transcript-blake2b",
  "whiteout-prover",
]

[dependencies]
jolt-claims.workspace = true
jolt-crypto.workspace = true
jolt-dit = { workspace = true, optional = true }
jolt-algebra.workspace = true
jolt-poly.workspace = true
jolt-r1cs.workspace = true
jolt-sumcheck.workspace = true
jolt-transcript.workspace = true
jolt-utils.workspace = true
rand_chacha = { workspace = true, optional = true }
rand_core.workspace = true
rayon.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
jolt-algebra = { workspace = true, features = ["bn254", "solinas"] }
jolt-transcript = { workspace = true, features = [
  "bn254",
  "transcript-blake2b",
] }
rand = { workspace = true, features = ["std_rng"] }
rand_chacha.workspace = true
rand_core.workspace = true

[[test]]
name = "whiteout_ring"
required-features = ["whiteout"]

[[test]]
name = "whiteout_sample"
required-features = ["whiteout-prover"]

[[test]]
name = "whiteout_params"
required-features = ["whiteout-prover"]

[[test]]
name = "whiteout_zeroize"
required-features = ["whiteout-prover"]

[[example]]
name = "sigma_dudect"
required-features = ["whiteout-diagnostics"]

[[example]]
name = "sigma_timing"
required-features = ["whiteout-diagnostics"]

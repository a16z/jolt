[package]
name = "jolt-zk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Generic BlindFold verifier infrastructure for the Jolt zkVM"

[features]
default = []
blindfold = [
  "dep:jolt-claims",
  "dep:jolt-crypto",
  "dep:jolt-r1cs",
  "dep:jolt-utils",
  "jolt-sumcheck/committed",
  "jolt-sumcheck/r1cs",
]
parallel = [
  "dep:rayon",
  "jolt-poly/parallel",
  "jolt-sumcheck/parallel",
  "jolt-claims?/parallel",
  "jolt-crypto?/parallel",
]
# The masking prover: `MaskingRecorder`, the masked prover's round channel and
# `ZkBackendProver`, with the proof-of-work search before each challenge,
# which copies the sponge state. It pulls in none of BlindFold's dependencies.
masking-prover = ["jolt-sumcheck/prover", "jolt-transcript/prover-grinding"]
# The BlindFold prover and the masking prover. Verifier builds leave it off.
prover = ["blindfold", "masking-prover"]
# `CommittedPads::uncommitted`, for tests of protocols written over the
# masked channel in other crates (Akita's masked levels).
test-support = []

[lints]
workspace = true

[dependencies]
jolt-claim-expr.workspace = true
jolt-claims = { workspace = true, optional = true }
jolt-crypto = { workspace = true, optional = true }
jolt-field.workspace = true
jolt-poly.workspace = true
jolt-r1cs = { workspace = true, optional = true }
jolt-sumcheck.workspace = true
jolt-transcript.workspace = true
jolt-utils = { workspace = true, optional = true }
rand_core.workspace = true
rayon = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
jolt-crypto = { workspace = true, features = ["bn254"] }
jolt-field = { workspace = true, features = ["bn254", "solinas"] }
jolt-transcript = { workspace = true, features = [
  "prover-entropy",
  "bn254",
  "solinas",
  "transcript-blake2b",
  "prover-grinding",
  "test-utils",
] }
rand_chacha.workspace = true
rand_core.workspace = true

[[test]]
name = "assignment_pipeline"
required-features = ["prover"]

[[test]]
name = "proof_pipeline"
required-features = ["prover"]

[[test]]
name = "r1cs_pipeline"
required-features = ["prover"]

[[test]]
name = "real_prover"
required-features = ["prover"]

[[test]]
name = "sumcheck_pipeline"
required-features = ["prover"]

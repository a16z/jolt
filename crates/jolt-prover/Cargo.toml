[package]
name = "jolt-prover"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Modular prover for the Jolt zkVM"
repository = "https://github.com/a16z/jolt"
keywords = ["SNARK", "zkvm", "prover"]
categories = ["cryptography"]

[lints]
workspace = true

[features]
default = ["parallel"]
parallel = ["jolt-kernels/parallel", "dep:rayon"]
prover-fixtures = ["jolt-kernels/test-utils", "jolt-prover-legacy/host"]
# The packed lattice protocol. One compiled prover produces exactly one PCS
# envelope; this feature replaces the Dory-specific stage 0/8 path.
akita = [
  "dep:jolt-akita",
  "jolt-verifier/akita",
  "jolt-claims/akita",
  "jolt-field/akita",
  "jolt-kernels/akita",
  "jolt-prover-legacy/akita",
]
# Apple GPU compute slots for the Akita field. Fiat-Shamir and proof
# orchestration remain on the host.
metal = ["akita", "jolt-akita/metal", "jolt-kernels/metal"]
# Compile-time ZK mode: committed sumcheck recorders, hiding witness
# commitments and stage-8 opening, and the BlindFold tail.
zk = [
  "jolt-verifier/zk",
  "jolt-kernels/zk",
  "dep:jolt-blindfold",
  "dep:rand_core",
  "jolt-prover-legacy/zk",
]
# The profile harness (`[[bin]] jolt-prover`, `profile` subcommand): guest
# compile/trace via the legacy host toolchain plus the jolt-profiling stack.
profiling = [
  "dep:bincode",
  "dep:chrono",
  "dep:clap",
  "dep:jolt-dory",
  "dep:jolt-inlines-keccak256",
  "jolt-inlines-keccak256/host",
  "dep:jolt-inlines-sha2",
  "jolt-inlines-sha2/host",
  "dep:jolt-profiling",
  "jolt-profiling/monitor",
  "jolt-profiling/summary",
  "dep:jolt-prover-legacy",
  "jolt-prover-legacy/host",
  "dep:postcard",
  "postcard/use-std",
  "dep:tracer",
]
# Per-batch heap snapshots from the profile harness.
allocative = [
  "dep:allocative",
  "dep:jolt-profiling",
  "jolt-field/allocative",
  "jolt-kernels/allocative",
  "jolt-profiling/allocative",
  "jolt-verifier/allocative",
]

[dependencies]
common.workspace = true
jolt-akita = { workspace = true, optional = true }
jolt-blindfold = { workspace = true, optional = true }
jolt-claims.workspace = true
jolt-crypto.workspace = true
jolt-field.workspace = true
jolt-kernels = { workspace = true, default-features = false }
jolt-lookup-tables.workspace = true
jolt-openings.workspace = true
jolt-poly = { workspace = true, default-features = false }
jolt-program.workspace = true
jolt-riscv.workspace = true
jolt-sumcheck.workspace = true
jolt-transcript.workspace = true
jolt-utils.workspace = true
jolt-verifier.workspace = true
jolt-witness.workspace = true
rand_core = { workspace = true, features = ["getrandom"], optional = true }
rayon = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

# Optional dependencies used by the profiling harness (bins cannot use
# dev-dependencies).
allocative = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
jolt-dory = { workspace = true, optional = true }
jolt-inlines-keccak256 = { workspace = true, optional = true }
jolt-inlines-sha2 = { workspace = true, optional = true }
jolt-profiling = { workspace = true, optional = true, default-features = false }
jolt-prover-legacy = { workspace = true, optional = true, default-features = false, features = [
  "minimal",
] }
postcard = { workspace = true, optional = true }
tracer = { workspace = true, optional = true }

[dev-dependencies]
bincode.workspace = true
clap.workspace = true
jolt-dory.workspace = true
jolt-inlines-keccak256 = { workspace = true, features = ["host"] }
jolt-inlines-sha2 = { workspace = true, features = ["host"] }
jolt-riscv.workspace = true
# Subscriber stack for tests; the profiling smoke test's summary usage
# arrives via the `profiling` feature's `jolt-profiling/summary`.
jolt-profiling = { workspace = true, default-features = false }
jolt-prover-legacy = { workspace = true, features = ["minimal"] }
postcard = { workspace = true, features = ["use-std"] }
rand_core = { workspace = true, features = ["getrandom"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
tracer.workspace = true

[[bin]]
name = "jolt-prover"
path = "src/bin/jolt_prover.rs"
required-features = ["profiling"]

# The end-to-end benchmark harness needs the legacy host toolchain (guest
# compilation) behind the same feature gate as the byte-diff tests.
[[example]]
name = "modular_benchmark"
required-features = ["prover-fixtures"]

[[example]]
name = "metal_outer_remainder_cpu_eval"
required-features = ["prover-fixtures", "metal"]

[[example]]
name = "metal_product_remainder_cpu_eval"
required-features = ["prover-fixtures", "metal"]

[[example]]
name = "metal_ram_read_write_cpu_eval"
required-features = ["prover-fixtures", "metal"]

[[example]]
name = "metal_ram_raf_evaluation_cpu_eval"
required-features = ["prover-fixtures", "metal"]

[[example]]
name = "metal_spartan_shift_cpu_eval"
required-features = ["prover-fixtures", "metal"]

[[example]]
name = "metal_ram_ra_claim_reduction_cpu_eval"
required-features = ["prover-fixtures", "metal"]

[[example]]
name = "metal_ram_ra_virtualization_cpu_eval"
required-features = ["prover-fixtures", "metal"]

[[example]]
name = "metal_ram_hamming_booleanity_cpu_eval"
required-features = ["prover-fixtures", "metal"]

[[example]]
name = "metal_ram_val_check_cpu_eval"
required-features = ["prover-fixtures", "metal"]

[[example]]
name = "metal_registers_read_write_cpu_eval"
required-features = ["prover-fixtures", "metal"]

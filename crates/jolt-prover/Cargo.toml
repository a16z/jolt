[package]
name = "jolt-prover"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Modular prover for the Jolt zkVM"
repository = "https://github.com/a16z/jolt"
keywords = ["SNARK", "zkvm", "prover"]
categories = ["cryptography"]

[lints]
workspace = true

[features]
default = ["parallel"]
parallel = ["jolt-kernels/parallel"]
prover-fixtures = ["jolt-prover-legacy/host"]
# The packed (lattice/Akita) protocol. Like jolt-verifier, one compiled
# prover proves exactly one protocol: this feature swaps the proof shape to
# the packed envelope, so the Dory (elliptic-curve) path `src/dory` is
# compiled out and the Akita (lattice) path `src/akita` (port in progress)
# replaces it. Mutually exclusive with a future zk feature by construction.
# jolt-prover-legacy must flip together with jolt-verifier: the verifier's
# own akita edge to it is a dev-dependency edge that does not propagate here,
# and a host-only legacy build against an akita-shaped jolt-verifier fails to
# compile.
akita = [
  "jolt-verifier/akita",
  "jolt-claims/akita",
  "jolt-field/akita",
  "jolt-prover-legacy/akita",
]

[dependencies]
common.workspace = true
jolt-claims.workspace = true
jolt-crypto.workspace = true
jolt-field.workspace = true
jolt-kernels = { workspace = true, default-features = false }
jolt-lookup-tables.workspace = true
jolt-openings.workspace = true
jolt-poly = { workspace = true, default-features = false }
jolt-program.workspace = true
jolt-sumcheck.workspace = true
jolt-transcript.workspace = true
jolt-verifier.workspace = true
jolt-witness.workspace = true
thiserror.workspace = true

[dev-dependencies]
jolt-dory.workspace = true
jolt-prover-legacy = { workspace = true, features = ["minimal"] }
postcard = { workspace = true, features = ["use-std"] }
rand_core = { workspace = true, features = ["getrandom"] }
serde = { workspace = true, features = ["derive"] }
tracer.workspace = true

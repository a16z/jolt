[package]
name = "jolt-prover"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Modular prover for the Jolt zkVM"
repository = "https://github.com/a16z/jolt"
keywords = ["SNARK", "zkvm", "prover"]
categories = ["cryptography"]

[lints]
workspace = true

[features]
default = ["parallel"]
parallel = ["jolt-kernels/parallel"]
prover-fixtures = ["jolt-prover-legacy/host"]
# The packed (lattice/Akita) protocol. Like jolt-verifier, one compiled
# prover proves exactly one protocol: this feature swaps the proof shape to
# the packed envelope, so the Dory (elliptic-curve) path `src/dory` is
# compiled out and the Akita (lattice) path `src/akita` replaces it.
# Mutually exclusive with `zk` (compile error on the combination).
# jolt-prover-legacy must flip together with jolt-verifier: the verifier's
# own akita edge to it is a dev-dependency edge that does not propagate here,
# and a host-only legacy build against an akita-shaped jolt-verifier fails to
# compile.
akita = [
  "jolt-verifier/akita",
  "jolt-claims/akita",
  "jolt-field/akita",
  "jolt-prover-legacy/akita",
]
# Compile-time ZK mode: committed sumcheck recorders, hiding witness
# commitments and stage-8 opening, and the BlindFold tail. One compiled
# prover produces exactly one protocol — there is no runtime mode flag.
zk = [
  "jolt-verifier/zk",
  "jolt-kernels/zk",
  "dep:jolt-blindfold",
  "dep:rand_core",
  # Dev-dependency forward (the jolt-verifier `zk` feature does the same):
  # the ZK e2e builds its preprocessing through legacy host code, which
  # carries the BlindFold vector-commitment setup only in its own zk mode.
  "jolt-prover-legacy/zk",
]
# The profile harness (`[[bin]] jolt-prover`, `profile` subcommand): guest
# compile/trace via the legacy host toolchain plus the jolt-profiling
# subscriber stack (chrome trace + summary.json + monitor counters).
profiling = [
  "dep:bincode",
  "dep:chrono",
  "dep:clap",
  "dep:jolt-dory",
  "dep:jolt-inlines-keccak256",
  "jolt-inlines-keccak256/host",
  "dep:jolt-inlines-sha2",
  "jolt-inlines-sha2/host",
  "dep:jolt-profiling",
  "jolt-profiling/monitor",
  "jolt-profiling/summary",
  "dep:jolt-prover-legacy",
  "jolt-prover-legacy/host",
  "dep:postcard",
  "postcard/use-std",
  "dep:tracer",
]
# Per-batch heap snapshots from the profile harness: emitted inside
# `prove()` after each stage (inert unless the harness sets a prefix),
# visiting the stage clear-output carriers and the proof session.
allocative = [
  "dep:allocative",
  "dep:jolt-profiling",
  "jolt-field/allocative",
  "jolt-kernels/allocative",
  "jolt-profiling/allocative",
  "jolt-verifier/allocative",
]

[dependencies]
common.workspace = true
jolt-blindfold = { workspace = true, optional = true }
jolt-claims.workspace = true
jolt-crypto.workspace = true
jolt-field.workspace = true
jolt-kernels = { workspace = true, default-features = false }
jolt-lookup-tables.workspace = true
jolt-openings.workspace = true
jolt-poly = { workspace = true, default-features = false }
jolt-program.workspace = true
jolt-riscv.workspace = true
jolt-sumcheck.workspace = true
jolt-transcript.workspace = true
jolt-verifier.workspace = true
jolt-witness.workspace = true
rand_core = { workspace = true, features = ["getrandom"], optional = true }
thiserror.workspace = true
tracing.workspace = true

# Optional: the `profiling` harness (bins cannot use dev-dependencies).
allocative = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
jolt-dory = { workspace = true, optional = true }
jolt-inlines-keccak256 = { workspace = true, optional = true }
jolt-inlines-sha2 = { workspace = true, optional = true }
# default-features = false: the `profiling` feature adds `summary`
# explicitly; `allocative` needs only the flamegraph hooks.
jolt-profiling = { workspace = true, optional = true, default-features = false }
jolt-prover-legacy = { workspace = true, optional = true, default-features = false, features = [
  "minimal",
] }
postcard = { workspace = true, optional = true }
tracer = { workspace = true, optional = true }

[dev-dependencies]
bincode.workspace = true
clap.workspace = true
jolt-dory.workspace = true
jolt-inlines-keccak256 = { workspace = true, features = ["host"] }
jolt-inlines-sha2 = { workspace = true, features = ["host"] }
# Subscriber stack for tests; the profiling smoke test's summary usage
# arrives via the `profiling` feature's `jolt-profiling/summary`.
jolt-profiling = { workspace = true, default-features = false }
jolt-prover-legacy = { workspace = true, features = ["minimal"] }
postcard = { workspace = true, features = ["use-std"] }
rand_core = { workspace = true, features = ["getrandom"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
tracer.workspace = true

[[bin]]
name = "jolt-prover"
path = "src/bin/jolt_prover.rs"
required-features = ["profiling"]

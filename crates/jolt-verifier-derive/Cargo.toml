[package]
name = "jolt-verifier-derive"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Derive macros for jolt-verifier per-stage sumcheck-batch aggregates"
repository = "https://github.com/a16z/jolt"

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }

[dev-dependencies]
jolt-claims.workspace = true
jolt-field = { workspace = true, features = ["binary"] }
jolt-poly.workspace = true
jolt-sumcheck.workspace = true
jolt-transcript = { workspace = true, features = ["binary", "test-utils", "transcript-blake2b"] }
jolt-verifier.workspace = true
serde = { workspace = true, features = ["derive"] }

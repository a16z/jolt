[package]
name = "jolt-kernels"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Compute kernels for the modular Jolt prover"
repository = "https://github.com/a16z/jolt"
keywords = ["SNARK", "zkvm", "prover"]
categories = ["cryptography"]

[lints]
workspace = true

[features]
default = ["parallel"]
cuda = [
  "dep:cudarc",
  "dep:strum",
  "dep:ark-bn254",
  "dep:ark-ec",
  "dep:ark-ff",
  "dep:ark-serialize",
  "dep:dory",
  "dep:jolt-crypto",
  "dep:jolt-dory",
  "dep:jolt-transcript",
  "jolt-dory/cuda",
  "jolt-witness/cuda",
]
akita = [
  "dep:jolt-akita",
  "jolt-claims/akita",
  "jolt-verifier/akita",
  "jolt-field/solinas",
]
# Shallow heap visitation of the proof session (profile harness flamegraphs).
allocative = ["dep:allocative", "jolt-field/allocative", "jolt-poly/allocative"]
parallel = [
  "dep:rayon",
  "jolt-poly/parallel",
  "jolt-utils/parallel",
  "jolt-witness/parallel",
]
# Compile-time ZK mode: witness commitments finish through the hiding
# streaming paths. Selected by jolt-prover's `zk` feature.
zk = []
# Field-inline protocol composition: kernel slots (composed Spartan lanes, field
# register read-write / val-evaluation / claim reductions, bytecode read-RAF
# field-inline legs) in both tiers. Selected by jolt-prover's `field-inline` feature.
field-inline = [
  "jolt-claims/field-inline",
  "jolt-verifier/field-inline",
  # The commit kernel reads the field-inline columns off the witness plane's
  # field-inline oracle seam.
  "jolt-witness/field-inline",
]

[dependencies]
strum = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }
ark-bn254 = { workspace = true, optional = true }
ark-ec = { workspace = true, optional = true }
ark-ff = { workspace = true, optional = true }
ark-serialize = { workspace = true, optional = true }
dory = { workspace = true, optional = true }
jolt-crypto = { workspace = true, optional = true }
jolt-dory = { workspace = true, optional = true }
jolt-transcript = { workspace = true, optional = true }
allocative = { workspace = true, optional = true }
jolt-akita = { workspace = true, optional = true }
jolt-claims.workspace = true
jolt-field.workspace = true
jolt-kernels-derive.workspace = true
jolt-lookup-tables.workspace = true
jolt-openings.workspace = true
jolt-poly = { workspace = true, default-features = false }
jolt-program.workspace = true
jolt-riscv.workspace = true
jolt-r1cs.workspace = true
jolt-sumcheck.workspace = true
jolt-utils.workspace = true
jolt-verifier.workspace = true
jolt-witness.workspace = true
rayon = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(any(target_os = "macos", all(target_os = "linux", target_env = "gnu")))'.dependencies]
libc.workspace = true

[dev-dependencies]
clap.workspace = true
jolt-inlines-keccak256 = { workspace = true, features = ["host"] }
jolt-inlines-sha2 = { workspace = true, features = ["host"] }
jolt-profiling.workspace = true
serde.workspace = true
sha2.workspace = true
sha3.workspace = true
bincode.workspace = true
jolt-host.workspace = true
jolt-prover.workspace = true
postcard = { workspace = true, features = ["use-std"] }
proptest.workspace = true
rand.workspace = true
serde_json = { workspace = true, features = ["std"] }
tracer = { workspace = true, features = ["test-utils", "std"] }
common = { workspace = true, features = ["std"] }
jolt-claims = { workspace = true, features = ["test-utils"] }
jolt-dory.workspace = true
jolt-witness = { workspace = true, features = ["test-utils"] }
jolt-transcript = { workspace = true, features = [
  "bn254",
  "transcript-blake2b",
] }
rand_chacha.workspace = true
rand_core.workspace = true

[[test]]
name = "cuda_e2e"
path = "tests/cuda_e2e.rs"
required-features = ["cuda"]

[[example]]
name = "cuda_profile"
required-features = ["cuda"]

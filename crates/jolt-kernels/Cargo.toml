[package]
name = "jolt-kernels"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Compute kernels for the modular Jolt prover"
repository = "https://github.com/a16z/jolt"
keywords = ["SNARK", "zkvm", "prover"]
categories = ["cryptography"]

[lints]
workspace = true

[features]
default = ["parallel"]
# Shallow heap visitation of the proof session (profile harness flamegraphs).
allocative = ["dep:allocative"]
parallel = [
  "dep:rayon",
  "jolt-poly/parallel",
  "jolt-utils/parallel",
  "jolt-witness/parallel",
]
# Compile-time ZK mode: witness commitments finish through the hiding
# streaming paths. Selected by jolt-prover's `zk` feature.
zk = []
cuda = [
  "dep:cudarc",
  "dep:ark-bn254",
  "dep:ark-ec",
  "dep:ark-ff",
  "dep:jolt-crypto",
  "dep:jolt-dory",
  "dep:jolt-transcript",
  "dep:dory",
  "dep:ark-serialize",
  "jolt-witness/cuda",
]

[dependencies]
allocative = { workspace = true, optional = true }
ark-bn254 = { workspace = true, optional = true }
ark-ec = { workspace = true, optional = true }
ark-ff = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }
ark-serialize = { workspace = true, optional = true }
dory = { workspace = true, optional = true }
jolt-crypto = { workspace = true, optional = true, features = ["bn254"] }
jolt-dory = { workspace = true, optional = true }
jolt-transcript = { workspace = true, optional = true }
jolt-claims.workspace = true
jolt-field.workspace = true
jolt-kernels-derive.workspace = true
jolt-lookup-tables.workspace = true
jolt-openings.workspace = true
jolt-poly = { workspace = true, default-features = false }
jolt-program.workspace = true
jolt-riscv.workspace = true
jolt-r1cs.workspace = true
jolt-sumcheck.workspace = true
jolt-utils.workspace = true
jolt-verifier.workspace = true
jolt-witness.workspace = true
rayon = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
ark-bn254.workspace = true
ark-ec.workspace = true
ark-ff.workspace = true
common = { workspace = true, features = ["std"] }
jolt-claims = { workspace = true, features = ["test-utils"] }
jolt-crypto = { workspace = true, features = ["bn254"] }
jolt-dory.workspace = true
jolt-program.workspace = true
jolt-prover-legacy = { workspace = true, features = ["default"] }
jolt-transcript.workspace = true
jolt-witness = { workspace = true, features = ["test-utils"] }
proptest.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rand_core.workspace = true
rayon.workspace = true
strum.workspace = true
tracer = { workspace = true, features = ["test-utils"] }

[[example]]
name = "cuda_primitive_bench"
required-features = ["cuda"]

[[example]]
name = "cuda_combine_hints_bench"
required-features = ["cuda"]

[[example]]
name = "cuda_lt_bench"
required-features = ["cuda"]

[[example]]
name = "cuda_address_phase_bench"
required-features = ["cuda"]

[[example]]
name = "cuda_address_driver_bench"
required-features = ["cuda"]

[[example]]
name = "cuda_address_split_bench"
required-features = ["cuda"]

[[example]]
name = "cuda_round_trip_bench"
required-features = ["cuda"]

[[example]]
name = "cuda_rows1_msm_bench"
required-features = ["cuda"]

[[example]]
name = "cuda_prepared_pairing_bench"
required-features = ["cuda"]

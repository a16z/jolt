[package]
name = "jolt-r1cs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "R1CS constraint data structures for the Jolt proving system"

[lints]
workspace = true

[dependencies]
jolt-claims = { workspace = true, optional = true }
jolt-field = { path = "../jolt-field", default-features = false }
jolt-riscv.workspace = true
jolt-poly = { path = "../jolt-poly", default-features = false }
num-traits.workspace = true
rayon = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
jolt-field = { path = "../jolt-field", features = ["bn254"] }
rand_chacha = { workspace = true }
rand_core = { workspace = true }

[features]
default = ["parallel", "claim-lowering"]
claim-lowering = ["dep:jolt-claims"]
field-inline = [
  "claim-lowering",
  "jolt-claims/field-inline",
  "jolt-riscv/field-inline",
]
parallel = ["rayon", "jolt-poly/parallel"]

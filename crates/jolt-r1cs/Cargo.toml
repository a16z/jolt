[package]
name = "jolt-r1cs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "R1CS constraint data structures for the Jolt proving system"

[lints]
workspace = true

[dependencies]
jolt-field = { path = "../jolt-field", default-features = false }
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true

[features]
fp128-bn254 = ["jolt-field/bn254", "jolt-field/solinas"]

[dev-dependencies]
num-bigint.workspace = true
jolt-field = { path = "../jolt-field", features = ["bn254"] }

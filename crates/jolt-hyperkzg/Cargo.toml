[package]
name = "jolt-hyperkzg"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Clear binary HyperKZG openings over BN254"

[lints]
workspace = true

[dependencies]
jolt-crypto = { workspace = true, features = ["bn254"] }
jolt-field = { workspace = true, features = ["bn254"] }
jolt-openings.workspace = true
jolt-poly.workspace = true
jolt-transcript.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true

[dev-dependencies]
jolt-transcript = { workspace = true, features = [
  "prover-entropy",
  "bn254",
  "test-utils",
  "transcript-blake2b",
] }
bincode.workspace = true

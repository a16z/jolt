[package]
name = "jolt-zeromorph"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Zeromorph multilinear polynomial commitment scheme for Jolt"

[lints]
workspace = true

[dependencies]
jolt-crypto = { path = "../jolt-crypto" }
jolt-field = { path = "../jolt-field" }
jolt-hyperkzg = { path = "../jolt-hyperkzg" }
jolt-openings = { path = "../jolt-openings" }
jolt-poly = { path = "../jolt-poly" }
jolt-transcript = { path = "../jolt-transcript" }
num-traits = { workspace = true }
rand_core = { workspace = true, features = ["getrandom"] }
rayon = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
jolt-field = { path = "../jolt-field", features = ["bn254"] }
postcard = { workspace = true, features = ["use-std"] }
rand_chacha = { workspace = true }

[[bench]]
name = "zeromorph"
harness = false

[package.metadata.cargo-machete]
ignored = ["rand_core"]

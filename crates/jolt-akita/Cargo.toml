[package]
name = "jolt-akita"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Akita batch opening adapter for the Jolt zkVM"

[lints]
workspace = true

[features]
default = ["parallel"]
# Rayon-backed akita kernels and the host backend thread pool. A zkVM guest
# builds without it: single-core, and the join/split machinery is pure cost.
parallel = ["akita-pcs/parallel", "akita-prover/parallel"]
# The akita transcript over the jolt-inlines Blake2b (guest verifiers).
blake2-inline = ["akita-transcript/blake2-inline", "akita-types/blake2-inline"]
# Field-inline (FR) protocol composition on the packed axis: extends the
# provisioned grouped-schedule params with the always-present FR limb-group
# profile. Selected by jolt-prover's `field-inline` feature; off keeps
# provisioning and the serialized setup params byte-identical to base.
field-inline = []
profiling = []

[dependencies]
# Jolt keeps its own catalogs for Jolt-specific trace shapes; Akita's shipped
# catalogs do not cover this adapter's complete production and test grids.
akita-algebra.workspace = true
akita-config.workspace = true
akita-error.workspace = true
akita-pcs = { workspace = true, default-features = false, features = ["transcript-blake2b"] }
akita-prover = { workspace = true, default-features = false, features = ["transcript-blake2b"] }
akita-challenges.workspace = true
akita-planner.workspace = true
akita-schedules.workspace = true
akita-serialization.workspace = true
akita-verifier.workspace = true
serde_bytes = "0.11"
akita-transcript.workspace = true
akita-types.workspace = true
jolt-crypto = { workspace = true, features = ["bn254"] }
jolt-field = { workspace = true, features = ["solinas"] }
jolt-openings.workspace = true
jolt-poly.workspace = true
jolt-transcript.workspace = true
rayon.workspace = true
serde = { workspace = true, features = ["derive"] }
tracing.workspace = true

[dev-dependencies]
bincode.workspace = true
criterion = { workspace = true }
# The FR provisioning pin test holds the registry's carried arity line to the
# jolt-claims packing law across the whole swept range. No features: an akita
# edge here would leak into workspace-wide unification and flip jolt-claims'
# packed-mode geometry for every `--all` lane.
jolt-claims = { workspace = true }
jolt-dory = { workspace = true }
# Subscriber stack only (bench tracing setup); no summary pipeline.
jolt-profiling = { path = "../jolt-profiling", default-features = false }
serde_json = { workspace = true, features = ["std"] }

[[bench]]
name = "akita_paths"
harness = false

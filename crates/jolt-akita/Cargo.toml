[package]
name = "jolt-akita"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Akita batch opening adapter for the Jolt zkVM"

[lints]
workspace = true

[features]
default = []
metal = ["dep:akita-metal"]
schedule-gen = []

[dependencies]
akita-algebra.workspace = true
akita-config.workspace = true
akita-field.workspace = true
akita-pcs = { workspace = true, features = ["parallel"] }
akita-prover = { workspace = true, features = ["parallel"] }
akita-challenges.workspace = true
akita-planner.workspace = true
akita-schedules.workspace = true
akita-transcript = { workspace = true, features = ["transcript-blake2b"] }
akita-types.workspace = true
jolt-crypto.workspace = true
jolt-field = { workspace = true, features = ["akita"] }
jolt-openings.workspace = true
jolt-poly.workspace = true
jolt-transcript.workspace = true
rayon.workspace = true
serde = { workspace = true, features = ["derive"] }
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
akita-metal = { workspace = true, optional = true, features = ["parallel"] }

[dev-dependencies]
blake3 = { workspace = true }
criterion = { workspace = true }
jolt-dory = { workspace = true }
# Subscriber stack only (bench tracing setup); no summary pipeline.
jolt-profiling = { path = "../jolt-profiling", default-features = false }
serde_json = { workspace = true, features = ["std"] }
memory-stats = { workspace = true }
tracing-subscriber = { workspace = true }

[[bench]]
name = "akita_paths"
harness = false

[[bench]]
name = "akita_eval_proof"
harness = false

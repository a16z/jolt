[package]
name = "jolt-akita"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Akita batch opening adapter for the Jolt zkVM"

[lints]
workspace = true

[features]
r1cs = [
  "dep:akita-transcript",
  "dep:jolt-r1cs",
  "dep:thiserror",
  "jolt-r1cs/integer-bn254",
  "jolt-transcript/r1cs",
  "jolt-poly/r1cs",
]
profiling = []

[dependencies]
akita-transcript = { workspace = true, optional = true, features = [
  "transcript-blake2b",
] }
jolt-r1cs = { workspace = true, optional = true }
# Jolt keeps its own catalogs for Jolt-specific trace shapes; Akita's shipped
# catalogs do not cover this adapter's complete production and test grids.
akita-algebra.workspace = true
akita-config.workspace = true
akita-error.workspace = true
akita-pcs = { workspace = true, features = ["parallel", "transcript-blake2b"] }
akita-prover = { workspace = true, features = ["parallel"] }
akita-challenges.workspace = true
akita-planner.workspace = true
akita-schedules.workspace = true
akita-types.workspace = true
jolt-crypto = { path = "../jolt-crypto", default-features = false, features = [
  "parallel",
] }
jolt-field = { path = "../jolt-field", default-features = false, features = [
  "solinas",
] }
jolt-openings = { path = "../jolt-openings", default-features = false, features = [
  "parallel",
] }
jolt-poly.workspace = true
jolt-transcript = { path = "../jolt-transcript", default-features = false }
rayon.workspace = true
serde = { workspace = true, features = ["derive"] }
tracing.workspace = true
thiserror = { workspace = true, optional = true }

[dev-dependencies]
bincode.workspace = true
jolt-transcript = { workspace = true, default-features = false, features = [
  "transcript-blake2b",
] }
serde_json = { workspace = true, features = ["std"] }

[[test]]
name = "r1cs_transcript"
required-features = ["r1cs"]

[[example]]
name = "terminal_r1cs_cost"
required-features = ["r1cs"]

[[example]]
name = "scalar_r1cs_cost"
required-features = ["r1cs"]

[[test]]
name = "r1cs_sparse_stream"
required-features = ["r1cs"]

[[example]]
name = "sparse_stream_r1cs_cost"
required-features = ["r1cs"]

[[example]]
name = "operator_norm_r1cs_cost"
required-features = ["r1cs"]

[[test]]
name = "r1cs_sparse_candidate"
required-features = ["r1cs"]

[[example]]
name = "sparse_candidate_r1cs_cost"
required-features = ["r1cs"]

[[example]]
name = "sparse_retry_r1cs_cost"
required-features = ["r1cs"]

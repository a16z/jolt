[package]
name = "jolt-akita"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Akita batch opening adapter for the Jolt zkVM"

[lints]
workspace = true

[features]
# Enables field-inline schedule coverage alongside the prover's field profile.
field-inline = []
profiling = []
# Whiteout (zero knowledge over Akita): the zero-knowledge configurations,
# hiding commitments, the masked opening and the response prover. Selects
# nothing; jolt-prover's `zk` with `akita` does.
zk = [
  "dep:jolt-zk",
  "dep:rand_core",
  "akita-config/zk",
  "akita-params/zk",
  "akita-pcs/zk",
  "akita-planner/zk",
]
# Test-only Whiteout parameters (`SigmaRanks::A40TestOnly`); inert without
# `zk`, so a clear build's test support compiles the clear protocol.
test-support = []

[dependencies]
spongefish = { workspace = true, features = ["sha3"] }
# Jolt keeps its own catalogs for Jolt-specific trace shapes; Akita's shipped
# catalogs do not cover this adapter's complete production and test grids.
akita-config.workspace = true
akita-error.workspace = true
akita-params.workspace = true
akita-pcs = { workspace = true, features = ["parallel"] }
akita-planner.workspace = true
akita-schedules.workspace = true
akita-types.workspace = true
# Canonical trace geometry without selecting the Akita PIOP feature.
jolt-claims.workspace = true
jolt-crypto = { path = "../jolt-crypto", default-features = false, features = [
  "lattice",
  "parallel",
] }
jolt-algebra = { path = "../jolt-algebra", default-features = false, features = [
  "solinas",
] }
jolt-openings = { path = "../jolt-openings", default-features = false, features = [
  "parallel",
] }
jolt-poly.workspace = true
jolt-transcript = { path = "../jolt-transcript", default-features = false }
jolt-zk = { workspace = true, optional = true, features = ["whiteout-prover"] }
rand_core = { workspace = true, optional = true }
rayon.workspace = true
serde = { workspace = true, features = ["derive"] }
tracing.workspace = true

[dev-dependencies]
bincode.workspace = true
rand = { workspace = true, features = ["std_rng"] }
jolt-transcript = { workspace = true, default-features = false, features = [
  "transcript-blake2b",
] }
serde_json = { workspace = true, features = ["std"] }

[package]
name = "jolt-akita"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Akita batch opening adapter for the Jolt zkVM"

[lints]
workspace = true

[features]
profiling = []

[dependencies]
# Jolt keeps its own catalogs for Jolt-specific trace shapes; Akita's shipped
# catalogs do not cover this adapter's complete production and test grids.
akita-algebra.workspace = true
akita-config.workspace = true
akita-error.workspace = true
akita-pcs = { workspace = true, features = ["parallel", "transcript-blake2b"] }
akita-prover = { workspace = true, features = ["parallel"] }
akita-challenges.workspace = true
akita-planner.workspace = true
akita-schedules.workspace = true
akita-transcript.workspace = true
akita-types.workspace = true
jolt-crypto.workspace = true
jolt-field = { workspace = true, features = ["solinas"] }
jolt-openings.workspace = true
jolt-poly.workspace = true
jolt-transcript.workspace = true
rayon.workspace = true
serde = { workspace = true, features = ["derive"] }
tracing.workspace = true

[dev-dependencies]
bincode.workspace = true
criterion = { workspace = true }
jolt-dory = { workspace = true }
# Subscriber stack only (bench tracing setup); no summary pipeline.
jolt-profiling = { path = "../jolt-profiling", default-features = false }
serde_json = { workspace = true, features = ["std"] }

[[bench]]
name = "akita_paths"
harness = false

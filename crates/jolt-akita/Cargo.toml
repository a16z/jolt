[package]
name = "jolt-akita"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Akita batch opening adapter for the Jolt zkVM"

[lints]
workspace = true

[features]
ntt-inline = ["akita-algebra/ntt-inline"]
default = ["parallel"]
# Rayon-backed akita kernels and the host backend thread pool. A zkVM guest
# builds without it: single-core, and the join/split machinery is pure cost.
parallel = ["akita-pcs/parallel", "akita-prover/parallel"]
# The akita transcript over the jolt-inlines Blake2b (guest verifiers).
blake2-inline = ["akita-transcript/blake2-inline", "akita-types/blake2-inline"]
# Field-inline (FR) protocol composition on the packed axis: extends the
# provisioned grouped-schedule params with the always-present FR limb-group
# profile. Selected by jolt-prover's `field-inline` feature; off keeps
# provisioning and the serialized setup params byte-identical to base.
field-inline = []
profiling = ["parallel"]

[package.metadata.cargo-machete]
# This direct edge selects the guest transcript implementation via blake2-inline.
ignored = ["akita-transcript"]

[dependencies]
# Jolt keeps its own catalogs for Jolt-specific trace shapes; Akita's shipped
# catalogs do not cover this adapter's complete production and test grids.
akita-algebra.workspace = true
akita-config.workspace = true
akita-error.workspace = true
akita-pcs = { workspace = true, default-features = false, features = [
  "transcript-blake2b",
] }
akita-prover = { workspace = true, default-features = false, features = [
  "transcript-blake2b",
] }
akita-challenges.workspace = true
akita-planner.workspace = true
akita-schedules.workspace = true
akita-serialization.workspace = true
akita-verifier.workspace = true
serde_bytes = "0.11"
akita-transcript.workspace = true
akita-types.workspace = true
jolt-crypto = { path = "../jolt-crypto", default-features = false, features = [
  "parallel",
] }
jolt-field = { path = "../jolt-field", default-features = false, features = [
  "solinas",
] }
jolt-openings = { path = "../jolt-openings", default-features = false, features = [
  "parallel",
] }
jolt-poly.workspace = true
jolt-transcript = { path = "../jolt-transcript", default-features = false }
rayon.workspace = true
serde = { workspace = true, features = ["derive"] }
tracing.workspace = true

[dev-dependencies]
bincode.workspace = true
jolt-transcript = { workspace = true, default-features = false, features = [
  "transcript-blake2b",
] }
# The field-inline provisioning pin test holds the registry's carried arity
# line to the jolt-claims packing law across the whole swept range. No
# features: an akita edge here would leak into workspace-wide unification and
# flip jolt-claims' packed-mode geometry for every `--all` lane.
jolt-claims = { workspace = true }
serde_json = { workspace = true, features = ["std"] }

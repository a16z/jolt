[package]
name = "jolt-akita"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Akita batch opening adapter for the Jolt zkVM"

[lints]
workspace = true

[dependencies]
# No `schedules-*` features: post-cutover Akita gitignores the generated
# schedule tables (`crates/akita-schedules/src/generated/fp*.rs`) and
# regenerates them in its own bootstrap, so a Git-dependency checkout cannot
# compile with those features enabled. Upstream presets fall back to planner
# DP when `schedule_catalog()` is `None`; the production `OneHotTrace` shapes
# use this crate's own checked-in catalogs (see `crate::schedules`).
akita-config = { workspace = true }
akita-error.workspace = true
akita-pcs = { workspace = true, features = ["parallel"] }
akita-prover = { workspace = true, features = ["parallel"] }
akita-challenges.workspace = true
akita-planner.workspace = true
akita-schedules.workspace = true
akita-transcript.workspace = true
akita-types.workspace = true
jolt-crypto.workspace = true
jolt-field = { workspace = true }
jolt-openings.workspace = true
jolt-poly.workspace = true
jolt-transcript.workspace = true
rayon.workspace = true
serde = { workspace = true, features = ["derive"] }
tracing.workspace = true

[dev-dependencies]
criterion = { workspace = true }
jolt-dory = { workspace = true }
# Subscriber stack only (bench tracing setup); no summary pipeline.
jolt-profiling = { path = "../jolt-profiling", default-features = false }
serde_json = { workspace = true, features = ["std"] }

[[bench]]
name = "akita_paths"
harness = false

[package]
name = "jolt-akita"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Akita batch opening adapter for the Jolt zkVM"

[lints]
workspace = true

[features]
terminal-contraction = ["jolt-field/terminal-contraction"]
default = ["parallel"]
parallel = ["akita-pcs/parallel"]
blake2-inline = ["jolt-transcript/blake2-inline"]
ntt-inline = ["akita-pcs/ntt-inline"]
field-inline = []
profiling = ["parallel"]

word-decode = ["jolt-field/word-decode"]
ont-static-base = ["akita-challenges/ont-static-base"]
tensor-no-carry = ["akita-algebra/tensor-no-carry"]
tensor-eq-runs = ["akita-algebra/tensor-eq-runs"]
setup-sop-structured = ["akita-pcs/setup-sop-structured"]
bytecode-fold = ["jolt-claims/bytecode-fold"]
fill-ingress = ["jolt-field/fill-ingress"]

[dependencies]
# Jolt keeps its own catalogs for Jolt-specific trace shapes; Akita's shipped
# catalogs do not cover this adapter's complete production and test grids.
akita-algebra.workspace = true
akita-config.workspace = true
akita-error.workspace = true
akita-pcs = { workspace = true, default-features = false, features = [
  "transcript-blake2b",
] }
akita-challenges.workspace = true
akita-planner.workspace = true
akita-schedules.workspace = true
akita-types.workspace = true
akita-params.workspace = true
akita-verifier.workspace = true
# Canonical trace geometry without selecting the Akita PIOP feature.
jolt-claims.workspace = true
jolt-crypto = { path = "../jolt-crypto", default-features = false, features = [
  "parallel",
] }
jolt-field = { path = "../jolt-field", default-features = false, features = [
  "solinas",
] }
jolt-openings = { path = "../jolt-openings", default-features = false, features = [
  "parallel",
] }
jolt-poly.workspace = true
jolt-transcript = { path = "../jolt-transcript", default-features = false, features = [
  "solinas",
] }
rayon.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_bytes.workspace = true
tracing.workspace = true

[dev-dependencies]
bincode.workspace = true
jolt-transcript = { workspace = true, default-features = false, features = [
  "transcript-blake2b",
] }
serde_json = { workspace = true, features = ["std"] }

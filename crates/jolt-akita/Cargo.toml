[package]
name = "jolt-akita"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Akita batch opening adapter for the Jolt zkVM"

[lints]
workspace = true

[features]
default = ["parallel"]
# Akita's rayon-backed kernels and backend thread pool. A single-core zkVM
# guest builds without it; Jolt's own prover kernels in this crate still link
# rayon, which a guest verifier never calls.
parallel = ["akita-pcs/parallel"]
# Akita's NTT kernels over the jolt-inlines NTT inline, for a RISC-V guest
# verifier. Akita runs on Jolt's Keccak transcript sponge, for which
# jolt-transcript has no guest inline.
ntt-inline = ["akita-pcs/ntt-inline"]
# Enables field-inline schedule coverage alongside the prover's field profile.
field-inline = []
# Whiteout (zero knowledge over Akita), verifier half: the zero-knowledge
# configurations and the masked opening's verification. It compiles no prover
# sampler (I6), so jolt-verifier's `akita` with `zk` selects only this.
zk = [
  "dep:jolt-zk",
  "jolt-zk/whiteout",
  "akita-config/zk",
  "akita-params/zk",
  "akita-pcs/zk",
  "akita-planner/zk",
]
# Whiteout's prover half: hiding commitments, pads and the response prover
# (jolt-zk's `whiteout-prover` sampler and akita-pcs's hiding sampler).
# jolt-prover's `zk` with `akita` selects it.
zk-prover = [
  "zk",
  "dep:rand_core",
  "jolt-zk/whiteout-prover",
  "akita-pcs/zk-prover",
]
profiling = ["parallel"]

[dependencies]
# Jolt keeps its own catalogs for Jolt-specific trace shapes; Akita's shipped
# catalogs do not cover this adapter's complete production and test grids.
akita-algebra.workspace = true
akita-config.workspace = true
akita-error.workspace = true
akita-pcs = { workspace = true, features = ["transcript-keccak"] }
akita-challenges.workspace = true
akita-planner.workspace = true
akita-schedules.workspace = true
akita-transcript.workspace = true
akita-types.workspace = true
akita-params.workspace = true
akita-verifier.workspace = true
# Canonical trace geometry without selecting the Akita PIOP feature.
jolt-claims.workspace = true
jolt-crypto = { path = "../jolt-crypto", default-features = false, features = [
  "parallel",
  "lattice",
] }
jolt-algebra = { path = "../jolt-algebra", default-features = false, features = [
  "solinas",
] }
jolt-openings = { path = "../jolt-openings", default-features = false, features = [
  "parallel",
] }
jolt-poly.workspace = true
jolt-transcript = { path = "../jolt-transcript", default-features = false, features = [
  "solinas",
] }
jolt-zk = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
rayon.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
bincode.workspace = true
jolt-transcript = { workspace = true, default-features = false, features = [
  "transcript-blake2b",
] }
rand = { workspace = true, features = ["std_rng"] }
serde_json = { workspace = true, features = ["std"] }

[package]
name = "jolt-spartan-verifier"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "PCS-generic clear Spartan verification for sparse R1CS"

[lints]
workspace = true

[features]
preprocessed = [
  "dep:jolt-hyperkzg",
  "dep:jolt-crypto",
  "dep:blake2",
  "jolt-transcript/bn254",
  "jolt-transcript/transcript-blake2b",
]

[dependencies]
jolt-hyperkzg = { workspace = true, optional = true }
jolt-crypto = { workspace = true, optional = true }
blake2 = { workspace = true, optional = true }
jolt-field.workspace = true
jolt-openings.workspace = true
jolt-poly.workspace = true
jolt-r1cs = { path = "../jolt-r1cs", default-features = false }
jolt-sumcheck.workspace = true
jolt-transcript.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true

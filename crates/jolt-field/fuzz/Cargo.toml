[workspace]

[package]
name = "jolt-field-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
jolt-field = { path = "..", default-features = false, features = [
  "bn254",
  "fuzzing",
  "solinas",
] }
num-traits = "0.2"

[[bin]]
name = "from-bytes"
path = "fuzz_targets/from_bytes.rs"
doc = false

[[bin]]
name = "field-arith"
path = "fuzz_targets/field_arith.rs"
doc = false

[[bin]]
name = "wide-accumulator-fmadd"
path = "fuzz_targets/wide_accumulator_fmadd.rs"
doc = false

[[bin]]
name = "wide-accumulator-merge"
path = "fuzz_targets/wide_accumulator_merge.rs"
doc = false

[[bin]]
name = "solinas-field-arith"
path = "fuzz_targets/solinas_field_arith.rs"
doc = false

[[bin]]
name = "fp128-asm-differential"
path = "fuzz_targets/fp128_asm_differential.rs"
doc = false

[package]
name = "jolt-field"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Shared field abstractions with BN254 and Solinas backends"
repository = "https://github.com/a16z/jolt"
keywords = ["SNARK", "cryptography", "finite-fields", "BN254", "Solinas"]
categories = ["cryptography"]

[package.metadata.cargo-machete]
ignored = ["cc"]

[lints]
workspace = true

[dependencies]
ark-ff = { workspace = true, optional = true }
ark-serialize = { workspace = true, optional = true }
ark-bn254 = { workspace = true, features = ["curve"], optional = true }
num-traits = { workspace = true }
serde = { workspace = true, features = ["derive"] }
allocative = { workspace = true, optional = true }
rand_core = { workspace = true }
rayon = { workspace = true, optional = true }
thiserror = { workspace = true }

[features]
default = ["bn254"]
bn254 = ["dep:ark-ff", "dep:ark-serialize", "dep:ark-bn254"]
solinas = []
asm = []
fuzzing = ["asm"]
parallel = ["dep:rayon"]
allocative = ["dep:allocative"]
fp128-proof-linkage = ["asm"]

[dev-dependencies]
bincode = { workspace = true }
criterion = { workspace = true }
num-bigint = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }

[build-dependencies]
cc = "1.2"

[[bench]]
name = "ext4_kernels"
harness = false

[[bench]]
name = "fp64_kernels"
harness = false

[[bench]]
name = "field_arithmetic"
harness = false
required-features = ["solinas"]

[[example]]
name = "fp128_production_witness"
required-features = ["solinas", "fp128-proof-linkage"]

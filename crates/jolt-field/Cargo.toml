[package]
name = "jolt-field"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Compatibility re-export of jolt-algebra under its former name"
repository = "https://github.com/a16z/jolt"
keywords = ["SNARK", "cryptography", "finite-fields", "BN254", "Solinas"]
categories = ["cryptography"]

[lints]
workspace = true

[dependencies]
jolt-algebra = { workspace = true, default-features = false }

[features]
default = ["bn254"]
bn254 = ["jolt-algebra/bn254"]
solinas = ["jolt-algebra/solinas"]
binary = ["jolt-algebra/binary"]
asm = ["jolt-algebra/asm"]
fuzzing = ["jolt-algebra/fuzzing"]
parallel = ["jolt-algebra/parallel"]
allocative = ["jolt-algebra/allocative"]
bytemuck = ["jolt-algebra/bytemuck"]
fp128-proof-linkage = ["jolt-algebra/fp128-proof-linkage"]
fp64-proof-linkage = ["jolt-algebra/fp64-proof-linkage"]

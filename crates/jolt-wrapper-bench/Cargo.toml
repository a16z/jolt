[package]
name = "jolt-wrapper-bench"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "Microbench for the wrapper's committed-bit transcript table and the batched layer-1 sumcheck stream: packed HyperKZG commits, row/column sumchecks, one opening"

[lints]
workspace = true

[dependencies]
bincode = { workspace = true }
jolt-crypto = { workspace = true }
jolt-field = { workspace = true, features = ["bn254"] }
jolt-hyperkzg = { workspace = true }
jolt-limb-bench = { path = "../jolt-limb-bench" }
jolt-openings = { workspace = true }
jolt-poly = { workspace = true }
jolt-transcript = { workspace = true }
rand_chacha = { workspace = true }
rand_core = { workspace = true }
rayon = { workspace = true }

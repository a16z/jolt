[package]
name = "jolt-witness"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Witness oracle infrastructure for Jolt proving"
repository = "https://github.com/a16z/jolt"
keywords = ["SNARK", "zkvm", "witness"]
categories = ["cryptography"]

[lints]
workspace = true

[features]
default = []
test-utils = ["dep:common"]
parallel = ["dep:rayon", "jolt-utils/parallel"]
# The device-resident trace walk (backend/cuda). Linkage only: the backend is
# a value the harness constructs, and the caller injects the CUDA stream.
cuda = ["dep:cudarc", "dep:common"]
field-inline = [
  "dep:rayon",
  "jolt-claims/field-inline",
  "jolt-lookup-tables/field-inline",
  "jolt-program/field-inline",
  "jolt-riscv/field-inline",
]

[dependencies]
common = { workspace = true, features = ["std"], optional = true }
cudarc = { workspace = true, optional = true }
jolt-claims.workspace = true
jolt-witness-derive.workspace = true
jolt-field.workspace = true
jolt-lookup-tables.workspace = true
jolt-program.workspace = true
jolt-riscv.workspace = true
jolt-utils.workspace = true
rayon = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
common = { workspace = true, features = ["std"] }
proptest.workspace = true

[package]
name = "jolt-metal"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Prover-only Metal runtime and field arithmetic for jolt-field"
repository = "https://github.com/a16z/jolt"
keywords = ["SNARK", "cryptography", "metal", "gpu"]
categories = ["cryptography"]

[lints]
workspace = true

[dependencies]
bytemuck = { workspace = true }
jolt-field = { path = "../jolt-field", default-features = false, features = [
  "bytemuck",
  "solinas",
] }
thiserror = { workspace = true }

# Metal is linked only on macOS. On every other target this crate has no
# Objective-C dependency and `Device::system_default` reports `Unavailable`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, features = ["std", "exception"] }
objc2-foundation = { workspace = true, features = [
  "std",
  "NSArray",
  "NSError",
  "NSString",
] }
objc2-metal = { workspace = true, features = [
  "std",
  "MTLAllocation",
  "MTLArgument",
  "MTLBuffer",
  "MTLCommandBuffer",
  "MTLCommandEncoder",
  "MTLCommandQueue",
  "MTLComputeCommandEncoder",
  "MTLComputePipeline",
  "MTLDevice",
  "MTLLibrary",
  "MTLResource",
  "MTLTypes",
] }

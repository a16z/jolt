[package]
name = "jolt-claims"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared claim and expression types for Jolt protocols"

[lints]
workspace = true

[features]
default = []
akita = []
# Layout digests over the jolt-inlines Blake2b (guest verifiers).
blake2-inline = ["dep:jolt-inlines-blake2", "jolt-inlines-blake2/digest"]
# Heap flamegraph visitation of the relation claim structs (profile harness).
allocative = ["dep:allocative"]
field-inline = ["jolt-lookup-tables/field-inline"]
test-utils = []

[dependencies]
allocative = { workspace = true, optional = true }
blake2.workspace = true
jolt-inlines-blake2 = { workspace = true, optional = true }
derive_more.workspace = true
jolt-claims-derive.workspace = true
jolt-field.workspace = true
jolt-lookup-tables.workspace = true
jolt-poly.workspace = true
jolt-openings.workspace = true
jolt-riscv = { workspace = true, features = ["serialization"] }
jolt-utils.workspace = true
serde = { workspace = true, features = ["alloc", "derive"] }
thiserror.workspace = true

[dev-dependencies]
bincode.workspace = true
rand_chacha.workspace = true
rand_core.workspace = true

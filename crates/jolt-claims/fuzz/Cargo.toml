[workspace]

[patch.crates-io]
ark-bn254 = { git = "https://github.com/a16z/arkworks-algebra", rev = "90c99eee214b01882e4aa7aa43ff6f30b9b7f51a" }
ark-ec = { git = "https://github.com/a16z/arkworks-algebra", rev = "90c99eee214b01882e4aa7aa43ff6f30b9b7f51a" }
ark-ff = { git = "https://github.com/a16z/arkworks-algebra", rev = "90c99eee214b01882e4aa7aa43ff6f30b9b7f51a" }
ark-serialize = { git = "https://github.com/a16z/arkworks-algebra", rev = "90c99eee214b01882e4aa7aa43ff6f30b9b7f51a" }

[package]
name = "jolt-claims-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[package.metadata.jolt-fuzz.targets.claim_lowering_equivalence]
focus = "soundness"
pr-seconds = 30
daily-seconds = 1200
weekly-seconds = 3600

[dependencies]
libfuzzer-sys = "0.4"
jolt-claims = { path = ".." }
jolt-field = { path = "../../jolt-field", features = ["bn254"] }
jolt-r1cs = { path = "../../jolt-r1cs" }

[[bin]]
name = "claim_lowering_equivalence"
path = "fuzz_targets/claim_lowering_equivalence.rs"
test = false
doc = false
bench = false

# Numeric discipline for the verifier crate (specs/verifier-closure-lints.md,
# tier 4). Field-element and verifier-expression arithmetic is side-effect
# free (modular, no overflow), so it is exempted from
# `clippy::arithmetic_side_effects`; primitive integer arithmetic is not.
arithmetic-side-effects-allowed = ["F", "jolt_field::Fr", "jolt_claims::Expr"]

disallowed-methods = [
  { path = "u32::wrapping_add", reason = "explicit wrapping evades arithmetic_side_effects; use checked or widened arithmetic in the verifier" },
  { path = "u32::wrapping_sub", reason = "explicit wrapping evades arithmetic_side_effects; use checked or widened arithmetic in the verifier" },
  { path = "u32::wrapping_mul", reason = "explicit wrapping evades arithmetic_side_effects; use checked or widened arithmetic in the verifier" },
  { path = "u32::wrapping_neg", reason = "explicit wrapping evades arithmetic_side_effects; use checked or widened arithmetic in the verifier" },
  { path = "u32::wrapping_shl", reason = "explicit wrapping evades arithmetic_side_effects; use checked or widened arithmetic in the verifier" },
  { path = "u32::wrapping_shr", reason = "explicit wrapping evades arithmetic_side_effects; use checked or widened arithmetic in the verifier" },
  { path = "u32::unchecked_add", reason = "explicit wrapping evades arithmetic_side_effects; use checked or widened arithmetic in the verifier" },
  { path = "u32::unchecked_sub", reason = "explicit wrapping evades arithmetic_side_effects; use checked or widened arithmetic in the verifier" },
  { path = "u32::unchecked_mul", reason = "explicit wrapping evades arithmetic_side_effects; use checked or widened arithmetic in the verifier" },
